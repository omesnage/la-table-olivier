 "Découpe, les noisettes et la ciboulette — Concasser les noisettes au couteau en morceaux de 2 à 3 mm. Ciseler la ciboulette en tronçons de 3 mm.",
 "La butternut — Verser 3 c. à soupe d'eau dans la sauteuse, ajouter les cubes, couvrir et cuire à feu moyen (plaque 5 sur 9) 8 min. Repères : la vapeur soulève légèrement le couvercle. Puis enlever le couvercle, ajouter l'huile d'olive et dorer 4 min à feu moyen-vif (plaque 7 sur 9) en remuant de temps en temps. Point de contrôle : la pointe d'un couteau entre sans résistance et les bords sont caramélisés. À éviter : trop d'eau, la butternut bouillirait en purée.",
 "Les noisettes — Torréfier à sec dans la petite poêle, feu moyen (plaque 5 sur 9), 2 min, en remuant. Repères : elles sentent la noisette grillée et brunissent légèrement. À éviter : les quitter des yeux, elles brûlent d'un coup.",
 "Le pain — Toaster le pain à sec 1 min 30 par face à feu moyen jusqu'à une belle couleur dorée.",
 "Les œufs brouillés — Battre les œufs avec sel et poivre. Essuyer la sauteuse, la chauffer à feu doux (plaque 2 sur 9) et verser les œufs. Remuer lentement à la spatule 4 à 5 min en raclant le fond. Repères : ils forment de petits nuages crémeux, sans bruit. Point de contrôle : ils sont encore un peu brillants quand on les retire du feu. À éviter : le feu fort, qui donne des œufs secs et granuleux.",
 "La crème — Hors du feu, incorporer la crème légère en remuant. La texture visée : crémeuse, qui coule doucement de la spatule.",
 "Dressage — Assiette plate large. Les œufs en vague au centre, la butternut en couronne autour, les noisettes et la ciboulette en pluie par-dessus, le pain en 2 mouillettes sur le côté. Geste final : un tour de poivre.",
 "Organisation — La butternut cuite se prépare 2 jours à l'avance, au frais en boîte, et se réchauffe 1 min à la poêle. Les noisettes torréfiées se gardent une semaine dans un bocal. Les œufs se cuisent au dernier moment."],
 "Retirer les œufs du feu quand ils sont encore un peu liquides : ils finissent de cuire seuls."],

"croque-poele":[20,2,[
 "Avant de commencer — Ustensiles : une poêle antiadhésive de 26 cm avec couvercle, une spatule large, une petite assiette et une planche. Sortir œuf, beurre et emmental 10 min avant.",
 "Découpe, l'emmental — Le râper ou le trancher en lamelles de 2 mm pour qu'il fonde vite et uniformément.",
 "Découpe, le jambon et la salade — Dégraisser le jambon, le plier en deux pour qu'il tienne dans la largeur du pain. Laver la salade, l'essorer et la garder au frais.",
 "Le montage — Beurrer très finement une face de chaque tranche de pain (5 g au total). Retourner l'une des tranches, garnir de jambon puis d'emmental, refermer avec l'autre tranche, face beurrée à l'extérieur.",
 "La cuisson du croque — Chauffer la poêle à feu moyen-doux (plaque 4 sur 9), poser le croque et couvrir. Cuire 3 min par face, en pressant à la spatule à mi-temps. Repères : le beurre chante doucement, une odeur de pain grillé monte. Point de contrôle : les deux faces sont dorées et l'emmental commence à filer sur les bords. À éviter : un feu vif, qui brûle le pain avant que le fromage ait fondu.",
 "L'œuf au plat — Sortir le croque, essuyer la poêle, casser l'œuf dans une petite assiette puis le faire glisser dans la poêle à feu doux (plaque 2 sur 9). Couvrir 2 min. Repères : le blanc devient opaque et le jaune reste brillant. Point de contrôle : le blanc est pris jusqu'au jaune. À éviter : un feu trop fort, qui fait des dentelles brunes.",
 "La salade — Effeuiller la salade et l'assaisonner d'un simple tour de poivre au dernier moment : le croque et l'œuf apportent déjà tout le goût, sans autre sauce.",
 "Dressage — Assiette plate. Couper le croque en deux en diagonale, poser une moitié à plat, l'autre appuyée dessus. Poser l'œuf au sommet (croque-madame), salade en petit bouquet à côté. Geste final : poivre sur le jaune.",
 "Organisation — Le croque se monte le matin et se garde filmé au frigo, cuisson au dernier moment. Cuit, il se réchauffe mal : à cuire à la demande."],
 "Presser légèrement le croque à la spatule en début de cuisson pour qu'il dore uniformément."],

"club-oeuf-jambon":[25,1,[
 "Avant de commencer — Ustensiles : une casserole, un grille-pain ou une poêle, un couteau-scie, une planche, un petit bol et deux piques en bois. Sortir la salade et les œufs du frigo 10 min avant.",
 "Les œufs durs — Plonger les œufs dans l'eau frémissante, feu moyen (plaque 5 sur 9), 9 minutes chrono. Repères : petits bouillons réguliers, sans ébullition violente. Puis 3 min dans l'eau glacée. Point de contrôle : le jaune est pris, jaune pâle et sans anneau vert. À éviter : dépasser 10 minutes, le jaune verdit et sèche.",
 "Découpe, les œufs — Écaler sous un filet d'eau, sécher, trancher en rondelles de 5 mm.",
 "Découpe, le concombre — Trancher en lamelles de 2 mm, longues, sur 6 cm. Les éponger.",
 "Découpe, le jambon et la salade — Plier le jambon en deux pour l'adapter à la taille du pain. Effeuiller la salade, en gardant des feuilles entières.",
 "La sauce — Mélanger le yaourt, la mayonnaise et la moutarde douce dans le bol. Texture visée : crémeuse, elle nappe la cuillère. Poivrer.",
 "Le pain — Toaster les tranches à sec, feu moyen (plaque 5 sur 9), 1 min 30 par face. Repères : le pain croque sous le doigt, sans brunir. À éviter : trop cuit, il déchire la bouche.",
 "Le montage — Tartiner les deux tranches de sauce. Sur la première, empiler salade, concombre, jambon puis œufs. Refermer avec la seconde, et presser doucement de la paume.",
 "Dressage — Couper en deux triangles nets, d'un seul geste de scie, planter une pique dans chaque. Assiette plate, triangles dressés côte à côte sur la tranche, quelques rondelles de concombre en pétales à côté.",
 "Organisation — Œufs cuits et sauce se préparent la veille (3 jours au frais, œufs non écalés). Le sandwich se monte le matin dans du papier sulfurisé, jusqu'à 6 h au frais."],
 "Couper d'un seul geste franc au couteau-scie pour garder des étages nets."],

"frittata-reblochon":[35,2,[
 "Avant de commencer — Ustensiles : une poêle antiadhésive de 24 cm avec couvercle (allant au four si possible), une spatule large, un bol, une fourchette, une planche. Sortir œufs et reblochon 15 min avant.",
 "Découpe, les pommes de terre — Les couper en rondelles de 5 mm.",
 "Découpe, l'oignon et les champignons — Émincer l'oignon en demi-lunes de 3 mm. Nettoyer les champignons au papier humide, les émincer en lamelles de 3 mm.",
 "Découpe, le reblochon — Retirer la croûte si elle est épaisse, couper en lamelles de 4 mm.",
 "L'oignon — Feu doux (plaque 3 sur 9), huile et 1 c. à soupe d'eau, 5 min. Repères : il devient translucide et sent le sucré, sans brunir. À éviter : le feu vif, il deviendrait amer.",
 "Les champignons — Ajouter les champignons, monter à feu vif (plaque 8 sur 9), 4 min. Repères : ils rendent leur eau puis dorent. Point de contrôle : la poêle est sèche. Saler seulement à la fin.",
 "Les pommes de terre — Ajouter les rondelles à feu moyen-vif (plaque 6 sur 9), 3 min, sans trop remuer. Repères : elles prennent une fine croûte dorée. À éviter : les écraser, elles doivent rester entières.",
 "L'appareil — Battre les œufs avec sel et poivre 20 secondes à la fourchette. Les verser sur la garniture en répartissant du bout de la spatule.",
 "La cuisson douce — Feu doux (plaque 2 sur 9), couvrir, 6 à 8 min. Repères : les bords prennent en premier, le centre tremble encore. Poser le reblochon les 3 dernières minutes, couvrir. Point de contrôle : le centre est pris au toucher et ne bouge plus quand on secoue la poêle. À éviter : le feu fort, la base brûlerait avant le cœur.",
 "Dressage — Glisser la frittata sur une planche ronde, laisser tiédir 2 min. Couper en 4 parts en triangles. Salade en petit tas à côté, assaisonnée d'un tour de poivre.",
 "Organisation — La frittata se garde 2 jours au frigo, se mange froide ou tiède. Les légumes se cuisent la veille et l'œuf se verse au dernier moment."],
 "Un clin d'œil à la tartiflette, en version légère."],

"riz-cantonais":[20,1,[
 "Avant de commencer — Ustensiles : un wok ou une grande poêle de 28 cm, une spatule en bois, un bol, une planche. Sortir le riz du frigo 15 min avant et l'égrener du bout des doigts : il doit être froid mais non compact.",
 "Découpe, la carotte — Éplucher, tailler en bâtonnets de 3 mm puis en petits dés de 3 mm.",
 "Découpe, le jambon — Couper en bandes de 5 mm puis en dés de 5 mm.",
 "Découpe, la cébette — Séparer le blanc du vert. Ciseler chacun en rondelles de 2 mm, dans deux petits tas.",
 "Les œufs — Les battre au fond d'un bol avec une pincée de sel. Les garder à portée de main.",
 "La carotte et le blanc de cébette — Chauffer le wok à feu vif (plaque 8 sur 9) avec la moitié de l'huile de sésame, 2 min. Repères : ça grésille franchement, la carotte devient plus vive. À éviter : cuire l'huile de sésame trop fort, elle deviendrait amère.",
 "Le riz — Ajouter le riz, l'écraser à la spatule pour détacher les grains, sauter 3 min. Repères : les grains rebondissent et crépitent, ils sont chauds à cœur. Point de contrôle : un grain n'est plus collé à son voisin. À éviter : remuer sans arrêt, le riz doit toucher le fond pour griller un peu.",
 "Les œufs et le jambon — Pousser le riz sur un côté, verser les œufs dans l'espace libre, brouiller 30 secondes, puis tout mélanger. Ajouter le jambon. Point de contrôle : les œufs sont pris en petits morceaux, jaunes et brillants.",
 "L'assaisonnement — Verser la sauce soja sur les bords du wok, elle caramélise en 5 secondes, puis mélanger 1 min. Hors du feu, ajouter le vert de cébette et le reste d'huile de sésame.",
 "Dressage — Tasser le riz dans un bol, le retourner sur une assiette creuse pour former un dôme. Parsemer de vert de cébette en pluie, geste final : quelques gouttes d'huile de sésame.",
 "Organisation — Le riz se cuit la veille et se garde 24 h au frigo. Le plat se mange aussitôt, le reste se garde 1 jour et se réchauffe 2 min à la poêle."],
 "Le riz de la veille ne colle pas : c'est le secret du bon riz sauté."],

"oeufs-mollets-pdt":[25,2,[
 "Avant de commencer — Ustensiles : une casserole, un saladier d'eau glacée, une poêle antiadhésive de 24 cm, un bol et un fouet. Sortir les œufs 10 min avant pour éviter que la coquille ne se fende.",
 "Les œufs mollets — Faire frémir l'eau à feu moyen (plaque 5 sur 9), plonger les œufs délicatement, 6 minutes chrono. Repères : petits bouillons, pas de gros remous. Puis 3 min dans l'eau glacée. Point de contrôle : à l'ouverture, le blanc est pris et le jaune coule. À éviter : les plonger dans une eau bouillante à gros bouillons, ils éclatent.",
 "Découpe, les pommes de terre — Les couper en deux dans la longueur.",
 "Les pommes de terre — Dorer côté coupé dans la poêle à feu moyen-vif (plaque 6 sur 9) sans huile ajoutée si antiadhésive, 8 min. Repères : ça grésille doucement, l'odeur de pomme de terre grillée monte. Point de contrôle : le côté plat est doré comme du caramel. À éviter : les retourner trop tôt, elles accrochent.",
 "La sauce — Fouetter le yaourt, la moutarde douce, la mayonnaise et la ciboulette ciselée (tronçons de 3 mm) dans le bol. Texture visée : elle nappe la cuillère. Goûter, poivrer.",
 "La salade — Laver et essorer la salade, la garder au frais dans un torchon.",
 "Écaler les œufs — Casser la coquille en la roulant sur le plan de travail, la retirer sous un filet d'eau froide pour ne pas abîmer le blanc.",
 "Dressage — Assiette creuse. Salade au fond, pommes de terre côté doré vers le haut en cercle, puis les œufs coupés en deux au dernier moment au centre. Napper de sauce en filet, geste final : un tour de poivre sur les jaunes.",
 "Organisation — Les œufs mollets se cuisent la veille (2 jours au frais, non écalés) et se réchauffent 1 min dans l'eau chaude. La sauce se garde 3 jours."],
 "6 minutes pour un jaune coulant, 7 pour un jaune crémeux : à ajuster selon le goût."],

"oeufs-cocotte":[25,2,[
 "Avant de commencer — Ustensiles : deux ramequins de 10 cm, un plat à gratin profond, une poêle de 24 cm, un four préchauffé à 180 °C, une planche. Sortir œufs et crème 15 min avant.",
 "Découpe, les champignons — Nettoyer au papier humide, émincer en lamelles de 3 mm.",
 "Découpe, le comté — Le râper finement.",
 "Les champignons — Feu vif (plaque 8 sur 9), 5 min, sans matière grasse dans une poêle antiadhésive. Repères : ils rendent d'abord de l'eau, puis grésillent en dorant. Point de contrôle : plus de liquide au fond. Saler seulement à la fin. À éviter : trop de champignons dans la poêle, ils cuisent à l'eau.",
 "Le montage — Répartir les champignons au fond des ramequins, casser un œuf dans chacun sans crever le jaune, verser 10 g de crème autour du jaune, parsemer de comté.",
 "Le bain-marie — Poser les ramequins dans le plat, verser de l'eau chaude jusqu'à mi-hauteur, enfourner 10 à 12 min. Repères : les bords du blanc deviennent opaques, le centre tremble encore. Point de contrôle : en secouant doucement, le jaune bouge comme une gelée. À éviter : dépasser 12 min, le jaune durcirait.",
 "Le pain — Toaster le pain à sec, feu moyen, puis couper en mouillettes de 1,5 cm de large.",
 "La salade — Essorer la salade, poivrer, la garder au frais.",
 "Dressage — Poser chaque ramequin sur une assiette plate, avec 3 mouillettes debout et un bouquet de salade. Geste final : poivre au moulin sur le comté fondu.",
 "Organisation — Les champignons se préparent la veille. Le montage se fait 1 h à l'avance, au frais ; ajouter 2 min de cuisson si les ramequins sortent du frigo."],
 "Le bain-marie cuit l'œuf en douceur : c'est lui qui donne cette texture soyeuse."],

"tamago-sando":[25,2,[
 "Avant de commencer — Ustensiles : une casserole, un saladier d'eau glacée, une fourchette, un bol, un couteau-scie et un film alimentaire. Sortir le pain du frigo 10 min avant s'il y était.",
 "Les œufs durs — Feu moyen (plaque 5 sur 9), eau frémissante, 10 min chrono. Repères : petits bouillons réguliers. Puis 5 min dans l'eau glacée. Point de contrôle : un jaune jaune pâle, ferme et sans anneau gris. À éviter : dépasser 11 min.",
 "Écaler les œufs — Les rouler sur le plan de travail, retirer la coquille sous un filet d'eau.",
 "La garniture — Écraser les œufs à la fourchette en gardant des morceaux de 5 mm. Ajouter mayonnaise, yaourt, la moitié de la ciboulette (tronçons de 3 mm), sel, poivre. Texture visée : crémeuse mais qui se tient en dôme. À éviter : la réduire en purée.",
 "Le concombre — Trancher en bâtonnets de 5 mm de section et 6 cm de long, éponger.",
 "Le montage — Poser une tranche de pain de mie (non grillée), étaler la garniture en dôme, plus épaisse au centre. Refermer avec la seconde tranche sans écraser. Point de contrôle : la garniture arrive jusqu'aux bords.",
 "La découpe — Envelopper serré dans le film 10 min au frais pour fixer la forme. Retirer le film, couper les croûtes au couteau-scie, puis couper en deux au centre pour montrer la garniture bombée.",
 "Dressage — Assiette plate. Les 2 rectangles debout, face coupée vers le convive, bâtonnets de concombre en fagot à côté. Geste final : ciboulette sur la garniture.",
 "Organisation — Garniture 24 h à l'avance au frais, filmée. Sandwich monté le matin dans du film, jusqu'à 6 h au frais."],
 "Le sandwich culte des konbini japonais : pain très moelleux, garniture généreuse."],

/* ---------- SAUMON & POISSON ---------- */
"saumon-unilaterale":[30,2,[
 "Avant de commencer — Ustensiles : une poêle antiadhésive de 26 cm avec couvercle, une sauteuse de 20 cm, une spatule fine de poisson, une planche et un papier absorbant. Sortir le saumon du frigo 15 min avant : un pavé tempéré cuit sans choc thermique.",
 "Découpe, l'échalote — La couper en deux, puis en fines lamelles dans le sens des fibres, puis en dés de 2 mm.",
 "Découpe, les champignons — Les nettoyer au papier humide, les émincer en lamelles de 3 mm.",
 "Le saumon — L'éponger soigneusement au papier absorbant, surtout côté peau, puis saler la chair. Une peau sèche est la condition d'une peau croustillante.",
 "Le riz crémeux, les aromates — Dans la sauteuse, feu doux (plaque 3 sur 9), faire suer l'échalote avec la moitié de l'huile 2 min. Repères : elle devient translucide et sent le sucré. À éviter : la colorer.",
 "Le riz crémeux, les champignons — Monter à feu vif (plaque 8 sur 9), ajouter les champignons 4 min. Repères : d'abord un grésillement d'eau, puis un dorage. Point de contrôle : la poêle est presque sèche.",
 "Le riz crémeux, la sauce — Ajouter le riz, la crème et 3 c. à soupe d'eau, feu doux (plaque 2 sur 9), remuer 2 à 3 min. Texture visée : onctueuse, elle nappe la cuillère. Saler, poivrer, couvrir hors du feu. À éviter : faire bouillir la crème.",
 "Le saumon à l'unilatérale — Chauffer le reste d'huile à feu moyen (plaque 5 sur 9) 1 min, poser le pavé côté peau et appuyer 10 secondes à la spatule pour l'empêcher de se recroqueviller. Cuire 7 à 8 min sans le retourner. Repères : ça grésille régulièrement, la chair change de couleur de bas en haut. Point de contrôle : la moitié de la hauteur est nacrée et le dessus reste rose-orangé translucide. À éviter : le retourner, on perd le contraste croustillant-fondant.",
 "Le repos — Poser le saumon sur une assiette chaude 2 min : la chaleur se répartit, le cœur finit de cuire.",
 "Dressage — Assiette creuse blanche. Placer un emporte-pièce de 8 cm au centre, y tasser le riz, retirer l'emporte-pièce. Poser le saumon peau vers le haut, en appui sur le riz. Geste final : ciboulette ciselée (3 mm) et un tour de poivre.",
 "Organisation — Le riz crémeux se prépare la veille (24 h au frigo) et se réchauffe avec 1 c. à soupe d'eau. Le saumon se cuit au dernier moment."],
 "La cuisson unilatérale garde un cœur mi-cuit très fondant."],

"saumon-teriyaki":[25,2,[
 "Avant de commencer — Ustensiles : une poêle antiadhésive de 26 cm avec couvercle, un petit bol, une cuillère à soupe, une planche, un couteau d'office. Sortir le saumon 15 min avant.",
 "La sauce — Dans le bol, mélanger la sauce soja, le miel, le gingembre râpé et 1 c. à soupe d'eau. Texture visée à la fin de la cuisson : elle nappe la cuillère et brille.",
 "Découpe, le saumon — Éponger le pavé, le couper en deux portions régulières si besoin, saler très peu (la sauce est salée).",
 "Découpe, le concombre — Le fendre en deux, retirer les graines à la cuillère, tailler des demi-rondelles de 3 mm. Saler légèrement, laisser dégorger 10 min, éponger.",
 "Le sésame — Torréfier à sec dans une petite poêle, feu moyen (plaque 5 sur 9), 1 min en remuant. Repères : elles blondissent et sentent la noisette. À éviter : s'éloigner, elles brûlent en 10 secondes.",
 "Le saumon, première face — Chauffer l'huile à feu moyen (plaque 5 sur 9) 1 min, poser le pavé côté peau. Cuire 4 min. Repères : grésillement régulier, la peau se détache seule de la poêle. Point de contrôle : la chair a blanchi sur les deux tiers de sa hauteur. À éviter : le déplacer avant que la peau ne se décolle.",
 "Le saumon, seconde face — Retourner et cuire 2 min. Baisser à feu doux (plaque 3 sur 9) avant d'ajouter la sauce.",
 "Le laquage — Verser la sauce, arroser le saumon à la cuillère pendant 1 min. Repères : elle mousse, épaissit, puis devient sirupeuse. Point de contrôle : une cuillère y laisse un sillon qui se referme lentement. À éviter : un feu trop fort, le miel brûle.",
 "Le concombre — Mélanger avec la moitié du sésame et une goutte d'huile de la poêle.",
 "Dressage — Assiette creuse. Riz en dôme au centre (utiliser un petit bol pour le mouler), saumon posé contre le riz, sauce nappée en filet, concombre en éventail. Geste final : sésame en pluie.",
 "Organisation — La sauce se prépare 3 jours à l'avance au frais. Le concombre se dégorge le matin. Le saumon se cuit au dernier moment ; les restes se mangent froids en salade le lendemain."],
 "Baisser le feu avant d'ajouter le miel pour qu'il caramélise sans brûler."],

"saumon-oeuf-pdt":[30,2,[
 "Avant de commencer — Ustensiles : une casserole, un saladier d'eau glacée, une poêle antiadhésive de 24 cm, un petit bol, un fouet, une planche. Sortir les œufs 10 min avant, le saumon fumé reste au frais jusqu'au dressage.",
 "L'œuf mollet — Feu moyen (plaque 5 sur 9), eau frémissante, 6 min chrono, puis 3 min à l'eau glacée. Repères : petits bouillons. Point de contrôle : le jaune coule à l'ouverture. À éviter : une ébullition violente, qui fissure la coquille.",
 "Écaler l'œuf — Le rouler sur le plan de travail, retirer la coquille sous un filet d'eau.",
 "Découpe, les pommes de terre — Les couper en rondelles de 8 mm.",
 "Les pommes de terre — Tiédir à la poêle, feu moyen (plaque 5 sur 9), 3 min sans matière grasse, en retournant une fois. Repères : elles sentent la pomme de terre chaude, sans colorer. Point de contrôle : tièdes au toucher. À éviter : les dorer, elles doivent rester tendres.",
 "La sauce — Hacher l'aneth en morceaux de 2 mm. Fouetter le yaourt, la moutarde douce et l'aneth. Texture visée : nappante, elle couvre le dos d'une cuillère. Saler, poivrer. Garder au frais.",
 "Découpe, le saumon fumé — Couper en lanières de 2 cm de large dans le sens de la longueur. Les rouler sur elles-mêmes pour former de petites roses de 3 cm.",
 "La salade — Laver, essorer, garder dans un torchon au frais.",
 "Dressage — Assiette creuse. Salade au fond, rondelles de pommes de terre en rosace, roses de saumon fumé sur le dessus. Œuf ouvert en deux au centre, jaune vers le haut. Geste final : sauce en filet et un brin d'aneth.",
 "Organisation — L'œuf se cuit la veille (2 jours au frais, non écalé). La sauce se garde 3 jours. Les pommes de terre se cuisent d'avance et se tiédissent au dernier moment."],
 "Des pommes de terre tièdes absorbent mieux la sauce : c'est tout le charme d'une salade de bistrot."],

"sandwich-saumon":[20,1,[
 "Avant de commencer — Ustensiles : une casserole, un saladier d'eau glacée, un petit bol, un couteau-scie, une planche. Sortir le fromage frais 10 min avant.",
 "L'œuf — Feu moyen (plaque 5 sur 9), eau frémissante, 9 min chrono, puis 3 min à l'eau glacée. Point de contrôle : jaune ferme, jaune pâle. À éviter : plus de 10 min.",
 "Écaler et trancher l'œuf — Rouler sur le plan de travail, écaler sous un filet d'eau, trancher en rondelles de 5 mm.",
 "Découpe, le concombre — Le trancher en lamelles de 2 mm, dans la longueur, et les éponger.",
 "Découpe, le saumon fumé — En lanières de 3 cm, à plier en accordéon lors du montage.",
 "La sauce — Dans le bol, fouetter le fromage frais, le yaourt et l'aneth haché (2 mm). Texture visée : épaisse mais tartinable. Poivrer.",
 "Le pain — Toaster à sec, feu moyen (plaque 5 sur 9), 1 min par face. Repères : il craque légèrement. À éviter : trop de coloration, le pain deviendrait dur.",
 "Le montage — Tartiner les deux tranches de sauce, disposer le concombre, puis le saumon en plis (pas à plat), puis l'œuf. Refermer et presser doucement de la paume.",
 "Dressage — Couper en deux triangles au couteau-scie, d'un geste franc. Poser sur une assiette plate, face coupée vers le haut. Geste final : un brin d'aneth entre les deux triangles.",
 "Organisation — Œuf et sauce se préparent la veille. Monter le sandwich au dernier moment ou le matin, dans du papier sulfurisé, 4 h au frais maximum."],
 "Le saumon posé en plis, et non à plat, donne du volume et du moelleux à chaque bouchée."],

"riz-saumon-fume":[25,2,[
 "Avant de commencer — Ustensiles : une poêle de 26 cm avec couvercle, une cuillère en bois, une planche, une râpe fine. Sortir le riz du frigo 10 min avant.",
 "Découpe, les champignons — Nettoyer au papier humide, émincer en lamelles de 3 mm.",
 "Découpe, le saumon fumé — En lanières de 1 cm de large, dans la longueur des tranches.",
 "Parmesan et ciboulette — Râper le parmesan finement. Ciseler la ciboulette en tronçons de 3 mm.",
 "Les champignons — Feu vif (plaque 8 sur 9), huile, 5 min. Repères : grésillement d'eau puis dorure. Point de contrôle : la poêle est sèche et les lamelles dorées. À éviter : saler au début.",
 "Le riz — Ajouter le riz cuit, la crème et 4 c. à soupe d'eau, feu doux (plaque 2 sur 9), remuer 2 à 3 min. Repères : le riz s'enveloppe d'une sauce laiteuse. Point de contrôle : texture onctueuse de risotto, qui nappe la cuillère. À éviter : un feu fort, la crème tournerait.",
 "Le parmesan — Hors du feu, incorporer le parmesan en remuant 30 secondes. Repères : la sauce devient brillante, plus liée. Saler après avoir goûté : parmesan et saumon fumé sont déjà salés.",
 "Le saumon — Ajouter la moitié des lanières hors du feu, mélanger. Point de contrôle : le saumon est à peine tiède, jamais cuit. À éviter : le chauffer, il devient sec et trop salé.",
 "Dressage — Assiette creuse tiède. Riz en dôme, roses de saumon fumé sur le dessus (le reste des lanières), ciboulette en pluie. Geste final : tour de poivre.",
 "Organisation — Champignons cuits la veille (2 jours au frais), riz cuit d'avance. Le plat se termine à la minute ; ne pas réchauffer le saumon."],
 "Le saumon ajouté hors du feu reste soyeux."],

"poke-saumon":[25,2,[
 "Avant de commencer — Ustensiles : un couteau bien aiguisé, une planche réservée au poisson, un bol, un économe, un bol d'eau glacée. Le saumon reste au frigo jusqu'à la dernière minute. Sortir le riz 10 min avant pour qu'il soit tiède, pas glacé.",
 "Découpe, le saumon — Couper en dés de 1,5 cm, d'un geste de scie et sans écraser. Les mettre dans le bol.",
 "La marinade — Verser la sauce soja et l'huile de sésame sur le saumon, mélanger doucement à la cuillère. Laisser 5 à 10 min au frais. Point de contrôle : le saumon s'assombrit à peine en surface. À éviter : plus de 15 min, il devient salé et ferme.",
 "Découpe, l'avocat — Fendre en deux, retirer le noyau, peler, trancher en lamelles de 5 mm, au dernier moment.",
 "Découpe, le concombre — En demi-rondelles de 3 mm, épépiné.",
 "Découpe, la carotte — En rubans de 1 mm à l'économe, plongés 5 min dans l'eau glacée pour qu'ils se recourbent.",
 "Le sésame — Torréfier à sec, feu moyen (plaque 5 sur 9), 1 min. Repères : elles blondissent. À éviter : les laisser brûler.",
 "Le riz — Réchauffer 1 min au micro-ondes avec 1 c. à soupe d'eau, le laisser tiédir. Point de contrôle : tiède, pas chaud : il ne doit pas cuire le saumon.",
 "Dressage — Bol large. Riz au fond, puis chaque garniture en quartier bien net : saumon mariné, avocat en éventail, concombre, carotte. Coriandre effeuillée au centre. Geste final : sésame en pluie.",
 "Organisation — Riz, concombre et carotte se préparent la veille. Le saumon se coupe et se marine au dernier moment ; l'avocat se tranche à la minute."],
 "Saumon cuit émietté possible si tu préfères éviter le cru."],

"pates-saumon":[25,1,[
 "Avant de commencer — Ustensiles : une grande casserole, une poêle de 26 cm, une passoire, une planche, une râpe. Sortir le saumon 10 min avant.",
 "Découpe, le saumon — Retirer la peau, couper en cubes de 2 cm. Saler légèrement.",
 "Parmesan et ciboulette — Râper le parmesan finement, ciseler la ciboulette en tronçons de 3 mm.",
 "Les pâtes — Cuire à l'eau bouillante salée (10 g de sel par litre), feu vif (plaque 9 sur 9), 1 minute de moins que le paquet. Prélever une louche d'eau de cuisson avant d'égoutter. Point de contrôle : le cœur de la pâte a encore un point blanc. À éviter : rincer, l'amidon est utile.",
 "Le saumon — Poêle chaude, feu moyen-vif (plaque 6 sur 9), huile, cuire les cubes 2 min en les retournant délicatement. Repères : grésillement, chair qui vire de rouge orangé à rose clair. Point de contrôle : rosé au cœur. À éviter : trop remuer, ils s'effritent.",
 "La sauce — Baisser à feu doux (plaque 3 sur 9), ajouter la crème et 3 c. à soupe d'eau de cuisson, laisser frémir 1 min. Texture visée : elle nappe la cuillère et se voit brillante.",
 "La liaison — Verser les pâtes égouttées, remuer 1 min pour les enrober. Hors du feu, ajouter le parmesan. Point de contrôle : la sauce colle aux pâtes, sans nager au fond.",
 "Dressage — Assiette creuse chaude. Enrouler les pâtes en nid à la fourchette et à la cuillère, poser le saumon sur le dessus sans l'écraser. Geste final : ciboulette et poivre.",
 "Organisation — Le saumon se coupe d'avance. Les pâtes se cuisent au dernier moment. Restes : 1 jour au frigo, réchauffer avec 2 c. à soupe d'eau."],
 "L'eau de cuisson des pâtes lie la sauce sans ajouter de crème : elle devient nappante et légère."],

"cabillaud-panko":[35,2,[
 "Avant de commencer — Ustensiles : une plaque de four avec papier sulfurisé, une casserole, une poêle avec couvercle, un fouet, un bol, un presse-purée ou une fourchette. Préchauffer le four à 200 °C. Sortir le cabillaud 10 min avant.",
 "Découpe, la carotte — Éplucher, tailler en bâtonnets de 5 mm de section sur 6 cm de long.",
 "Le cabillaud — Éponger, saler et poivrer les deux faces. Retirer les éventuelles arêtes au doigt et à la pince.",
 "La croûte — Mélanger le panko avec la moitié de l'huile dans un bol. Badigeonner le dessus du poisson de moutarde douce (fine couche de 1 mm), puis presser le panko dessus.",
 "La cuisson du poisson — Poser sur la plaque, enfourner 12 min, milieu du four. Repères : la croûte prend une couleur dorée à l'odeur de pain grillé, la chair devient nacrée. Point de contrôle : la chair se détache en lamelles à la pointe d'un couteau. À éviter : un four trop chaud, la croûte brûle avant que le poisson ne cuise.",
 "Les carottes glacées — Casserole, feu moyen (plaque 5 sur 9), un fond d'eau de 1 cm, le reste d'huile, sel, couvrir 8 min. Retirer le couvercle et laisser l'eau s'évaporer. Point de contrôle : la pointe d'un couteau entre, les carottes brillent.",
 "L'écrasé — Réchauffer les pommes de terre 3 min à la poêle. Les écraser à la fourchette avec le lait chaud et le beurre. Texture visée : grossière, moelleuse, avec des morceaux. À éviter : la travailler trop, elle devient collante.",
 "La ciboulette — Ciseler en tronçons de 3 mm, mélanger à l'écrasé.",
 "Dressage — Assiette plate. Écrasé en quenelle à gauche, cabillaud en appui contre lui, croûte vers le haut, carottes en fagot à droite. Geste final : ciboulette en pluie.",
 "Organisation — La croûte de panko se prépare la veille. L'écrasé se réchauffe avec un peu de lait. Le poisson se cuit au dernier moment."],
 "La moutarde sert de colle pour le panko et parfume le poisson sans aucune acidité si elle est douce."],

"fish-chips":[35,2,[
 "Avant de commencer — Ustensiles : une plaque de four, une poêle antiadhésive de 28 cm, deux assiettes creuses, un bol, une fourchette. Préchauffer le four à 220 °C. Sortir le poisson 10 min avant.",
 "Découpe, les frites — Couper les pommes de terre cuites en frites de 1,5 cm de section.",
 "Les frites — Les enrober de 1 c. à café d'huile, saler. Étaler sans qu'elles se touchent sur la plaque, enfourner 20 min en les retournant à mi-cuisson. Repères : elles sifflent, prennent une couleur dorée. Point de contrôle : le bord est croustillant et se casse. À éviter : les entasser, elles ramollissent.",
 "La sauce tartare douce — Hacher l'aneth et la ciboulette (2 mm). Mélanger avec le yaourt et la mayonnaise, saler, poivrer. Texture visée : épaisse, elle nappe la cuillère. Sans cornichons ni câpres.",
 "Découpe, le poisson — Éponger, couper en 3 bâtonnets de 2 cm de large et 8 cm de long, saler.",
 "La panure — Dans une assiette, le blanc d'œuf battu à la fourchette ; dans l'autre, le panko. Passer chaque bâtonnet dans le blanc, puis dans le panko en pressant fort. À éviter : des mains mouillées, la panure colle aux doigts.",
 "La cuisson du poisson — Feu moyen (plaque 5 sur 9), reste d'huile, 2 à 3 min par face. Repères : grésillement régulier, dorure. Point de contrôle : la croûte est dorée et le poisson ferme au toucher. À éviter : retourner trop tôt, la panure se décolle.",
 "Le repos — Poser sur du papier absorbant 30 secondes pour éliminer l'excès de gras.",
 "Dressage — Papier kraft ou assiette plate. Frites en fagot, bâtonnets de poisson appuyés dessus, ramequin de sauce à côté. Geste final : un brin d'aneth.",
 "Organisation — Les pommes de terre se cuisent et se coupent la veille. La sauce se prépare 2 jours avant. Le poisson se pane 1 h avant et attend au frais."],
 "Le blanc d'œuf seul fait adhérer la panure tout en restant très léger."],

"cabillaud-gingembre":[30,2,[
 "Avant de commencer — Ustensiles : un cuit-vapeur (ou une casserole + une assiette creuse + un couvercle), une petite casserole, une poêle antiadhésive, une planche, un économe. Sortir le cabillaud 10 min avant.",
 "Découpe, le gingembre — L'éplucher à la cuillère, le couper en tranches de 1 mm, puis en bâtonnets de 1 mm de section (julienne).",
 "Découpe, la cébette — Fendre en deux dans la longueur, tailler en fils de 5 cm de long.",
 "Découpe, les champignons — Nettoyer au papier humide, émincer en lamelles de 3 mm.",
 "Le poisson — Éponger, saler légèrement, le poser dans l'assiette creuse avec la moitié du gingembre.",
 "La cuisson vapeur — Eau frémissante, feu moyen (plaque 5 sur 9), couvrir, 8 à 10 min. Repères : la vapeur s'échappe régulièrement. Point de contrôle : la chair est opaque et se détache en gros pétales. À éviter : une eau qui bout trop fort, le poisson se dessèche.",
 "Les champignons — Feu vif (plaque 8 sur 9), 5 min sans matière grasse. Repères : grésillement puis dorure. Saler à la fin. À éviter : trop remuer.",
 "La sauce — Chauffer la sauce soja avec 2 c. à soupe d'eau et le reste du gingembre 1 min dans la petite casserole. Texture visée : liquide, parfumée.",
 "L'huile chaude — Poser la cébette sur le poisson. Chauffer l'huile de sésame 20 secondes dans une petite louche, feu vif, et la verser sur la cébette : elle grésille et libère ses parfums. À éviter : la laisser fumer.",
 "Dressage — Assiette creuse. Riz en dôme d'un côté, champignons de l'autre, poisson au centre nappé de sauce. Geste final : cébette fraîche en pluie.",
 "Organisation — Le riz se cuit d'avance. Le gingembre se coupe la veille (au frais, film). Poisson et huile chaude se font à la minute."],
 "L'huile chaude versée sur le gingembre libère son parfum sans le piquant."],

"tacos-poisson":[25,1,[
 "Avant de commencer — Ustensiles : une poêle antiadhésive de 26 cm, un petit bol, une planche, une râpe. Sortir le poisson 10 min avant.",
 "Découpe, le poisson — Éponger, couper en bâtonnets de 1,5 cm de section, saler et frotter au paprika doux.",
 "Découpe, l'avocat — Fendre, peler, trancher en lamelles de 5 mm, au dernier moment.",
 "Découpe, la salade et la carotte — Émincer la salade en lanières de 5 mm. Râper la carotte à gros trous.",
 "La sauce — Effeuiller la coriandre, hacher très fin (2 mm). Mélanger avec le yaourt, une pincée de sel. Texture visée : lisse, couleur vert pâle.",
 "Le poisson — Feu moyen-vif (plaque 6 sur 9), huile, 2 min par face. Repères : grésillement, croûte rousse. Point de contrôle : la chair se défait en lamelles nacrées. À éviter : trop retourner, il se réduit en miettes.",
 "Les tortillas — Poêle sèche, feu moyen (plaque 5 sur 9), 20 secondes par face. Repères : elles gonflent par endroits. À éviter : trop longtemps, elles deviennent cassantes. Envelopper dans un torchon pour les garder souples.",
 "Le montage — Sur chaque tortilla : sauce, salade, poisson émietté en gros morceaux, avocat, carotte, un trait de sauce.",
 "Dressage — Assiette plate. Plier chaque taco en deux, poser debout, ouverture vers le haut. Geste final : coriandre effeuillée.",
 "Organisation — Sauce et carotte râpée se préparent la veille. Le poisson se cuit au dernier moment. Ne pas monter d'avance."],
 "Le paprika doux apporte la couleur et le parfum des tacos, sans piquant."],

"burger-saumon":[30,2,[
 "Avant de commencer — Ustensiles : un grand couteau, une planche, une poêle de 26 cm, un petit bol, une petite poêle, une spatule. Sortir le pain du frigo 10 min avant, le saumon au frais jusqu'au dernier moment.",
 "Découpe, le saumon — Retirer la peau. Couper en tranches de 5 mm, puis en bandes, puis hacher grossièrement au couteau, en morceaux de 4 mm. Saler.",
 "Le steak — Façonner un steak de 9 cm de diamètre et 2 cm d'épaisseur, sans trop tasser. Laisser 10 min au frais pour qu'il se tienne. À éviter : le mixeur, qui donne une pâte.",
 "Le sésame — Torréfier 1 min à sec, feu moyen (plaque 5 sur 9). Repères : elles blondissent et sentent la noisette.",
 "La sauce — Mélanger mayonnaise, yaourt, sauce soja et la moitié du sésame. Texture visée : lisse, nappante.",
 "Découpe, le concombre et la salade — Rondelles de 3 mm ; salade effeuillée en larges feuilles.",
 "La cuisson du steak — Feu moyen (plaque 5 sur 9), huile, 3 min par face. Repères : grésillement modéré, croûte dorée. Point de contrôle : rosé au centre en le pressant, ferme sur les bords. À éviter : écraser le steak à la spatule, il perd son jus.",
 "Le pain — Toaster les faces coupées, 1 min à sec, feu moyen. Repères : elles dorent et croquent.",
 "Le montage — Pain du bas, sauce, salade, concombre, saumon, sauce, chapeau.",
 "Dressage — Assiette plate. Planter une pique au centre du burger, poser à droite quelques rondelles de concombre. Geste final : sésame sur le chapeau.",
 "Organisation — Le steak se façonne la veille (film au frigo, 24 h). La sauce se garde 3 jours. Le montage et la cuisson se font à la minute."],
 "Hacher le saumon au couteau, jamais au mixeur : la texture reste celle d'un vrai steak."],

"onigiri-saumon":[40,3,[
 "Avant de commencer — Ustensiles : une poêle, un bol d'eau, un bol de sel fin, un film alimentaire, une planche. Le riz rond doit être tiède (environ 40 °C) : le réchauffer 40 secondes au micro-ondes s'il est froid.",
 "Le saumon — Saler légèrement le pavé, le cuire à feu moyen (plaque 5 sur 9) 4 min par face avec un fond d'huile. Repères : grésillement régulier. Point de contrôle : la chair est opaque et s'émiette. Retirer la peau.",
 "La garniture — Émietter le saumon à la fourchette en morceaux de 5 mm, mélanger avec la sauce soja.",
 "Découpe, le concombre — Bâtonnets de 5 mm de section sur 6 cm.",
 "Le sésame — Torréfier à sec 1 min. À éviter : trop foncé.",
 "Le façonnage — Se mouiller les mains, les saler d'une pincée. Prendre 110 g de riz, l'aplatir dans la paume, creuser un puits, ajouter 1 c. à soupe de saumon, refermer. Presser en triangle en tournant trois fois, sans écraser. Point de contrôle : le triangle tient debout, sans fissure. À éviter : trop presser, le riz devient une boule dure.",
 "Le nori — Couper la feuille en 2 bandes de 4 cm. En enrouler une autour de la base de chaque onigiri, au dernier moment, pour qu'elle reste croustillante.",
 "Le concombre — Assaisonner d'huile de sésame et de sésame torréfié.",
 "Dressage — Planche ou assiette plate. Onigiri alignés debout, concombre en fagot à côté. Geste final : quelques graines de sésame sur le riz.",
 "Organisation — Les onigiri se préparent le matin et se gardent filmés à température ambiante 4 h (pas au frigo, le riz durcit). Saumon cuit la veille au frais."],
 "Un film alimentaire facilite le façonnage et rend les triangles réguliers."],

"tataki-thon":[25,3,[
 "Avant de commencer — Ustensiles : une poêle en fonte ou antiadhésive de 24 cm, une planche, un couteau très bien aiguisé, un petit bol. Sortir le thon 10 min avant.",
 "Découpe, la cébette — Fendre en deux dans la longueur, tailler en fils de 5 cm.",
 "Découpe, l'avocat — Fendre, peler, trancher en lamelles de 5 mm, au dernier moment.",
 "La croûte de sésame — Éponger le thon, le badigeonner d'un voile d'huile, le rouler dans le sésame en pressant sur toutes les faces.",
 "La sauce — Mélanger la sauce soja, le gingembre râpé et 1 c. à café d'eau. Texture visée : liquide, parfumée.",
 "La saisie — Chauffer la poêle à feu vif (plaque 9 sur 9) 2 min, jusqu'à ce qu'elle fume légèrement. Saisir le thon 40 secondes par face, puis 15 secondes sur chaque tranche. Repères : un grésillement violent, une odeur de sésame grillé. Point de contrôle : le pourtour est doré sur 2 mm, le cœur reste rouge vif. À éviter : cuire plus de 1 min par face, le thon devient gris et sec.",
 "Le repos — Poser 2 min sur une planche. La chaleur se répartit.",
 "La découpe — Couteau bien aiguisé, tranches de 1 cm d'un seul geste de scie, sans appuyer.",
 "Dressage — Assiette plate. Riz en dôme, tranches de thon en éventail qui se chevauchent, avocat en éventail à côté. Sauce en filet. Geste final : cébette en pluie.",
 "Organisation — Riz cuit d'avance. Thon acheté le jour même, roulé dans le sésame juste avant la cuisson."],
 "Le thon doit être de qualité sashimi : il se mange presque cru, seule la croûte est saisie."],

/* ---------- CREVETTES ---------- */
"bowl-crevettes-avocat":[25,2,[
 "Avant de commencer — Ustensiles : une poêle antiadhésive de 26 cm, un petit bol, un fouet, un économe, une planche. Sortir les crevettes du frigo 10 min avant, le riz 10 min avant pour qu'il soit tiède.",
 "Découpe, les crevettes — Retirer le boyau noir avec la pointe d'un couteau en incisant le dos sur 1 cm, puis les sécher soigneusement au papier absorbant. Saler très légèrement.",
 "Découpe, l'avocat — Fendre, retirer le noyau, peler, trancher en lamelles de 5 mm, au dernier moment.",
 "Découpe, le concombre — Fendre, épépiner, tailler en demi-rondelles de 3 mm.",
 "La sauce — Fouetter le yaourt, la mayonnaise et la sauce soja dans le bol. Texture visée : lisse et brillante, elle nappe la cuillère. Garder au frais.",
 "Le sésame — Torréfier à sec 1 min, feu moyen (plaque 5 sur 9). Repères : elles blondissent et sentent la noisette.",
 "Les crevettes — Feu vif (plaque 8 sur 9), huile, les étaler en une couche, 90 secondes sans y toucher, puis 60 secondes de l'autre côté. Repères : elles grésillent fort et rosissent dès le contact. Point de contrôle : elles forment un C bien rosé, sans être serrées en O. À éviter : la poêle surchargée, les crevettes bouilliraient.",
 "Le riz — Tiédir 1 min au micro-ondes avec 1 c. à soupe d'eau.",
 "Dressage — Bol large. Riz au fond, avocat en éventail, concombre en quartier, crevettes sur le dessus. Sauce en zigzag, geste final : sésame en pluie.",
 "Organisation — Riz et sauce se préparent la veille. Crevettes cuites à la minute ; l'avocat se tranche au dernier moment."],
 "Une crevette en C est parfaite, une crevette en O est trop cuite."],

"crevettes-pdt-grecque":[30,2,[
 "Avant de commencer — Ustensiles : une grande poêle antiadhésive de 28 cm, une assiette plate pour écraser les pommes de terre, un petit bol, un fouet. Sortir les crevettes 10 min avant.",
 "Découpe, les pommes de terre — Les couper en deux ou en gros cubes de 3 cm. Les écraser légèrement avec le plat d'une assiette (« smashed »), jusqu'à 1,5 cm d'épaisseur.",
 "Découpe, les herbes — Aneth et ciboulette hachés à 2 mm.",
 "La sauce grecque — Fouetter le yaourt, la mayonnaise et les herbes. Texture visée : épaisse, elle nappe la cuillère. Saler, poivrer. Au frais.",
 "Les crevettes — Retirer le boyau, sécher soigneusement. Saler légèrement.",
 "Les pommes de terre — Feu moyen-vif (plaque 6 sur 9), la moitié de l'huile, 10 min, retourner une seule fois à mi-cuisson. Repères : grésillement régulier, dorure et bords croustillants. Point de contrôle : elles se détachent seules de la poêle. À éviter : les remuer sans arrêt, elles ne croustillent pas.",
 "Les crevettes — Pousser les pommes de terre, ajouter le reste d'huile, feu vif (plaque 8 sur 9), 90 secondes par face. Repères : elles rosissent, forment un C. Point de contrôle : chair opaque sans être serrée.",
 "La salade — Essorer et poivrer.",
 "Dressage — Assiette plate. Salade en couronne, pommes de terre en pyramide, crevettes autour. Sauce en quenelle à côté, brin d'aneth pour finir.",
 "Organisation — Les pommes de terre se cuisent la veille (elles sont déjà cuites). La sauce grecque se garde 3 jours."],
 "Les pommes de terre « smashed » croustillent davantage grâce aux bords irréguliers."],

"riz-saute-crevettes":[20,2,[
 "Avant de commencer — Ustensiles : un wok ou une grande poêle de 28 cm, une spatule en bois, un bol, une planche. Riz cuit la veille, sorti 15 min avant et égrené du bout des doigts. Crevettes sorties 10 min avant.",
 "Découpe, les crevettes — Retirer le boyau, sécher soigneusement, saler très légèrement.",
 "Découpe, la carotte — En petits dés de 3 mm.",
 "Découpe, la cébette — Blanc et vert séparés, en rondelles de 2 mm.",
 "L'œuf — Le battre au fond d'un bol avec une pincée de sel.",
 "Les crevettes — Feu vif (plaque 8 sur 9), la moitié de l'huile, 1 min par face. Repères : un grésillement franc, elles rosissent. Point de contrôle : elles forment un C. Les réserver.",
 "La carotte — Ajouter le reste d'huile, sauter la carotte et le blanc de cébette 2 min. Repères : elle devient plus vive.",
 "Le riz — Ajouter le riz, l'écraser à la spatule, sauter 3 min. Repères : les grains rebondissent, crépitent. Point de contrôle : un grain n'est plus collé à son voisin. À éviter : le remuer sans arrêt.",
 "L'œuf et l'assaisonnement — Pousser le riz, verser l'œuf, brouiller 30 secondes, mélanger. Remettre les crevettes, verser la sauce soja sur les bords chauds, sauter 1 min.",
 "Dressage — Tasser le riz dans un bol, retourner sur une assiette creuse. Vert de cébette en pluie, sésame torréfié en finition.",
 "Organisation — Riz la veille, légumes coupés le matin. Le plat se mange aussitôt ; restes 1 jour, réchauffer à la poêle."],
 "Réserver les crevettes pendant la cuisson du riz : elles restent tendres."],

"nouilles-crevettes":[25,2,[
 "Avant de commencer — Ustensiles : un wok ou une poêle de 28 cm, des pinces ou deux spatules, une planche, un petit bol, une passoire. Sortir les crevettes 10 min avant.",
 "Les nouilles — Cuire à l'eau bouillante selon le paquet moins 1 minute, rincer brièvement à l'eau froide, bien égoutter, mélanger avec quelques gouttes d'huile pour éviter qu'elles collent. Point de contrôle : elles restent fermes sous la dent.",
 "Découpe, les champignons — Nettoyer au papier humide, émincer en lamelles de 3 mm.",
 "Découpe, le gingembre — Éplucher à la cuillère, tailler en bâtonnets de 1 mm.",
 "Découpe, la cébette et les crevettes — Ciseler la cébette en rondelles de 2 mm. Retirer le boyau des crevettes, les sécher.",
 "La sauce — Mélanger la sauce soja, le miel et 1 c. à soupe d'eau dans le bol. Texture visée : liquide, légèrement sirupeuse une fois chauffée.",
 "Les crevettes — Feu vif (plaque 8 sur 9), la moitié de l'huile, 1 min par face. Point de contrôle : elles forment un C. Réserver. À éviter : les laisser cuire plus.",
 "Les champignons — Feu vif, reste d'huile, gingembre, 4 min. Repères : les champignons rendent leur eau puis dorent. Point de contrôle : la poêle est presque sèche.",
 "Les nouilles — Ajouter les nouilles et la sauce, sauter 2 min à feu vif en soulevant avec les pinces. Repères : la sauce disparaît en enrobant. Remettre les crevettes 30 secondes. À éviter : couper les nouilles en remuant, préférer soulever.",
 "Dressage — Assiette creuse. Tourner les nouilles en nid avec une fourchette et une cuillère, crevettes sur le dessus, cébette en pluie.",
 "Organisation — Nouilles cuites et huilées la veille (au frais 24 h). Sauce mélangée d'avance. Cuisson à la minute."],
 "Le gingembre en bâtonnets, plutôt que râpé, parfume sans agresser."],

"ebi-fry":[35,3,[
 "Avant de commencer — Ustensiles : une poêle antiadhésive de 28 cm, deux assiettes creuses, un petit bol, une grille ou du papier absorbant. Sortir les crevettes 10 min avant.",
 "Découpe, les crevettes — Les décortiquer en gardant la queue si possible, retirer le boyau. Faire 3 petites entailles de 3 mm sur le ventre et les presser à plat pour qu'elles restent droites. Saler légèrement.",
 "Découpe, la salade — Émincer en lanières de 2 mm (très fines), garder au frais.",
 "La sauce — Mélanger mayonnaise, yaourt et sauce soja. Texture visée : lisse, nappante. Au frais.",
 "La panure — Blanc d'œuf battu à la fourchette dans une assiette, panko dans l'autre. Passer chaque crevette dans le blanc puis dans le panko en pressant. À éviter : les doigts mouillés, la panure y reste collée.",
 "La cuisson — Feu moyen (plaque 5 sur 9), huile, 2 min par face. Repères : grésillement régulier, la panure devient dorée et croustillante. Point de contrôle : couleur dorée uniforme, la crevette est ferme. À éviter : un feu trop fort, la panure brûle avant que la crevette ne cuise.",
 "Le repos — Sur grille ou papier absorbant 30 secondes, pour que la panure reste sèche.",
 "Le riz — Tiédir 1 min au micro-ondes avec un peu d'eau.",
 "Dressage — Assiette plate. Riz en dôme, salade en meule fine à côté, crevettes alignées et appuyées sur le riz, queue vers le haut. Sauce en ramequin. Geste final : un trait de sauce sur une crevette.",
 "Organisation — Les crevettes se paneront 1 h avant, au frais, posées sur une plaque. La sauce se prépare la veille. La cuisson se fait au dernier moment."],
 "Les entailles sous le ventre empêchent les crevettes de s'enrouler : elles restent bien droites, comme au Japon."],

"tartine-crevettes":[15,1,[
 "Avant de commencer — Ustensiles : une casserole, un saladier d'eau glacée, une fourchette, un couteau-scie, une planche. Sortir le pain 10 min avant.",
 "L'œuf mollet — Feu moyen (plaque 5 sur 9), eau frémissante, 6 minutes chrono, puis 3 min à l'eau glacée. Repères : petits bouillons. Point de contrôle : le jaune coule à l'ouverture. À éviter : une eau à gros bouillons.",
 "Écaler et découper l'œuf — Rouler, écaler sous un filet d'eau, couper en deux au dernier moment.",
 "L'avocat — Fendre, peler, écraser à la fourchette avec l'huile d'olive, une pincée de sel et de poivre. Texture visée : crémeuse avec des morceaux de 5 mm. À éviter : trop lisse.",
 "Découpe, les crevettes et la coriandre — Sécher les crevettes cuites au papier absorbant. Effeuiller la coriandre, hacher grossièrement (3 mm).",
 "Le pain — Toaster à sec 1 min 30 par face, feu moyen (plaque 5 sur 9). Repères : doré, croustillant.",
 "Le montage — Tartiner d'avocat sur toute la surface, poser les crevettes en rosace, puis l'œuf.",
 "Dressage — Assiette plate. Tartine en diagonale, coriandre en pluie. Geste final : poivre au moulin sur l'œuf.",
 "Organisation — L'œuf se cuit la veille (2 jours au frais). L'avocat s'écrase au dernier moment, pour qu'il ne noircisse pas."],
 "Un avocat bien mûr cède légèrement sous le doigt à côté de la queue."],

"curry-crevettes":[30,2,[
 "Avant de commencer — Ustensiles : une sauteuse de 26 cm avec couvercle, une cuillère en bois, un économe, une planche. Sortir les crevettes 10 min avant.",
 "Découpe, la butternut — Éplucher, retirer les graines, tailler en cubes de 1,5 cm.",
 "Découpe, les crevettes — Retirer le boyau, sécher soigneusement, saler légèrement.",
 "La butternut — Feu moyen (plaque 5 sur 9), huile, 5 min en remuant. Repères : légère dorure. Ajouter 3 c. à soupe d'eau, couvrir 8 min. Point de contrôle : la pointe d'un couteau entre sans résistance. À éviter : trop de liquide.",
 "Les épices — Pousser la butternut, ajouter le curry doux et le gingembre au fond, feu moyen, 20 secondes. Repères : l'odeur de curry monte, sans fumée. À éviter : brûler l'épice.",
 "Le lait de coco — Verser le lait de coco et 3 c. à soupe d'eau, feu doux (plaque 3 sur 9), laisser frémir 3 min. Texture visée : la sauce nappe la cuillère, couleur jaune doré.",
 "Les crevettes — Les ajouter, couvrir, 3 min à feu doux. Point de contrôle : rosées et fermes, jamais serrées en O. À éviter : bouillir la sauce, elles deviennent caoutchouteuses.",
 "Découpe, la coriandre — Effeuiller.",
 "Dressage — Bol large. Riz moulé dans un petit bol et démoulé, curry à côté, coriandre en pluie. Geste final : un filet de lait de coco.",
 "Organisation — La butternut se cuit la veille. La sauce se prépare 2 jours à l'avance ; ajouter les crevettes au dernier moment."],
 "Curry doux uniquement : parfumé, sans piquant."],

"galette-crevettes":[30,3,[
 "Avant de commencer — Ustensiles : une poêle antiadhésive de 24 cm avec couvercle, une assiette plate de 26 cm pour retourner, une râpe, un torchon, un bol, un fouet. Sortir œufs et crevettes 10 min avant.",
 "Découpe, la courgette — La râper, saler, laisser 10 min. La presser fortement dans un torchon pour retirer toute l'eau. Point de contrôle : la courgette est sèche, en boule compacte.",
 "Découpe, les crevettes — Retirer le boyau, les couper en 3 morceaux de 1 cm.",
 "Découpe, la cébette — En rondelles de 2 mm.",
 "La pâte — Fouetter œufs, farine et 2 c. à soupe d'eau. Ajouter courgette, crevettes et cébette. Texture visée : épaisse, elle nappe la cuillère. À éviter : trop mélanger.",
 "La cuisson, première face — Feu moyen (plaque 5 sur 9), huile, verser la pâte, aplatir à 1,5 cm, couvrir, 5 min. Repères : petit grésillement, le bord prend. Point de contrôle : le dessous est doré.",
 "Le retournement — Poser l'assiette dessus, retourner d'un geste franc, glisser la galette dans la poêle. Cuire 4 min. À éviter : hésiter, elle casserait.",
 "La sauce okonomiyaki — Chauffer le soja et le miel 30 secondes, feu doux. Texture visée : elle nappe la cuillère.",
 "Dressage — Assiette plate. Quadriller la galette de sauce puis d'un fin trait de mayonnaise. Couper en 4 parts. Geste final : un peu de cébette.",
 "Organisation — La pâte se prépare 2 h à l'avance. Restes 1 jour, réchauffés à la poêle."],
 "Version sans chou du classique d'Osaka, tout aussi gourmande."],

/* ---------- POULET ---------- */
"oyakodon":[25,2,[
 "Avant de commencer — Ustensiles : une poêle de 24 cm avec couvercle, un bol, une fourchette, une planche, un couteau bien affûté. Sortir œufs et poulet 15 min avant.",
 "Découpe, le poulet — Couper le filet en morceaux de 2 cm. Saler légèrement.",
 "Découpe, l'oignon — Émincer en demi-lunes de 3 mm.",
 "Découpe, la cébette — Ciseler en biais en tronçons de 2 mm.",
 "Les œufs — Les battre légèrement avec les dents de la fourchette, sans les mélanger complètement : des traces de blanc doivent subsister.",
 "Le bouillon — Feu moyen (plaque 5 sur 9), porter le bouillon, le soja et le mirin à frémissement. Texture visée : liquide, parfumé.",
 "L'oignon — Ajouter, cuire 3 min à frémissement. Repères : il devient translucide et sent le sucré. Point de contrôle : il plie sans casser.",
 "Le poulet — Ajouter les morceaux, feu moyen (plaque 5 sur 9), 5 à 6 min. Repères : ils passent de rose à blanc. Point de contrôle : en coupant le plus gros, la chair est blanche et juteuse. À éviter : couvrir, le poulet cuirait trop vite.",
 "Les œufs — Verser les deux tiers des œufs en cercle, couvrir 1 min, puis le reste, couvrir 30 secondes. Repères : ils prennent en nappe crémeuse. Point de contrôle : baveux, pas secs. À éviter : plus de 2 min.",
 "Dressage — Bol profond. Riz chaud, garniture glissée dessus avec le jus, cébette en pluie.",
 "Organisation — Riz cuit d'avance. Poulet et oignon se coupent la veille. Les œufs se versent au dernier moment."],
 "L'œuf doit rester fondant et à peine pris : c'est la signature de l'oyakodon, « parent et enfant »."],

"poulet-teriyaki":[30,2,[
 "Avant de commencer — Ustensiles : une poêle antiadhésive de 26 cm avec couvercle, un couteau de chef, une planche, un petit bol. Sortir le poulet 15 min avant.",
 "Découpe, le poulet — Ouvrir le filet en deux dans l'épaisseur (comme un livre) pour obtenir une épaisseur régulière de 1,5 cm. Saler légèrement.",
 "La sauce — Mélanger soja, miel, mirin et 1 c. à soupe d'eau. Texture visée : elle nappe la cuillère une fois réduite.",
 "Découpe, le concombre — Demi-rondelles de 3 mm, saler 10 min, éponger.",
 "Le sésame — Torréfier 1 min à sec.",
 "La cuisson, première face — Feu moyen (plaque 5 sur 9), huile, 5 min sans y toucher. Repères : grésillement régulier, dorure. Point de contrôle : le dessous est doré et se décolle. À éviter : retourner trop tôt.",
 "La cuisson, seconde face — Retourner, couvrir, feu moyen-doux (plaque 4 sur 9), 4 min. Point de contrôle : le jus qui sort est clair, la chair blanche à cœur.",
 "Le laquage — Baisser à feu doux (plaque 3 sur 9), verser la sauce, arroser 1 à 2 min. Repères : elle épaissit et brille. À éviter : le miel brûle si le feu est fort.",
 "Le repos — Laisser reposer 2 min sur une planche, puis trancher en biais en lamelles de 1 cm.",
 "Dressage — Assiette creuse. Riz en dôme, poulet en éventail, jus en filet, concombre à côté. Geste final : sésame en pluie.",
 "Organisation — Sauce d'avance (3 jours). Poulet mariné 24 h dans la sauce (avant cuisson). Restes 2 jours au frais."],
 "Trancher le poulet en biais après repos pour garder tout son jus."],

"poulet-katsu":[35,3,[

 "La panure — Œuf battu dans une assiette, panko dans l'autre. Passer l'escalope dans l'œuf, puis dans le panko en pressant fermement.",

 "La cuisson, seconde face — Retourner, 4 min. Point de contrôle : jus clair, chair blanche à cœur. À éviter : un feu trop fort, la panure brûle avant que le poulet ne cuise.",

 "Dressage — Assiette plate. Riz en dôme, katsu tranché en bandes de 2 cm et remonté en éventail, salade en meule à côté. Sauce en filet, quelques gouttes sur la salade.",

"poulet-creme-tagliatelles":[30,2,[
 "Avant de commencer — Ustensiles : une grande casserole, une sauteuse de 28 cm, une passoire, une planche. Sortir le poulet 10 min avant.",

 "Le poulet — Feu moyen-vif (plaque 6 sur 9), huile, 3 min par face en une couche. Repères : dorure, grésillement. Point de contrôle : blanc à cœur. Réserver. À éviter : trop remuer.",

 "Réserver le poulet puis le remettre à la fin : il reste moelleux au lieu de sécher."],

"burger-poulet":[30,2,[

"poulet-sesame-coco":[30,2,[

 "Découpe, le concombre — Fendre, épépiner, tailler en demi-rondelles de 3 mm.",
 "La sauce sésame-coco — Tiédir le lait de coco 30 secondes. Y fouetter le tahini et le reste de soja, puis 2 c. à soupe d'eau chaude. Texture visée : lisse, satinée, elle nappe la cuillère. À éviter : chauffer fort, le tahini tranche.",

 "Le mariage — Feu doux (plaque 3 sur 9), verser la sauce sur le poulet, mélanger 1 min. Repères : elle épaissit et enrobe. À éviter : bouillir.",

 "Dressage — Assiette creuse. Riz en dôme, poulet en éventail, sauce en filet, concombre à côté. Geste final : coriandre effeuillée.",
 "Organisation — La sauce se prépare 2 jours à l'avance au frais, remuer avant usage. Poulet mariné 24 h."],
 "Un sésame crémeux et une coco douce : tout le parfum, sans piment."],

"wrap-caesar":[25,2,[

"yakitori":[35,2,[

 "La cuisson — Feu moyen (plaque 5 sur 9), huile, 8 min en tournant d'un quart toutes les 2 min. Repères : grésillement, dorure. Point de contrôle : blanc à cœur, jus clair.",

function norm(s){
  return String(s||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/[’`]/g,"'")
    .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
}
function lookup(name){ const n = norm(name); return ING_DB.find(e => n.includes(e.k)) || null; }

function unitKind(u){
  const x = norm(u);
  if (!x) return "p";
  if (x === "g" || x === "gr" || x === "grammes") return "g";
  if (x === "kg") return "kg";
  if (x === "ml") return "g";
  if (x === "cl") return "cl";
  if (x === "l") return "l";
  if (/(c\.? ?a ?c|cafe|cac|cuillere a cafe)/.test(x)) return "c";
  if (/(c\.? ?a ?s|soupe|cas)/.test(x)) return "s";
  if (/(pincee|brins|quelques|au gout)/.test(x)) return "z";
  return "p"; // pièce, tranche, feuille, pot, tasse…
}
function ingKcal(i){
  const q = parseFloat(String(i.q).replace(",", "."));
  if (!q || isNaN(q)) return 0;
  const e = lookup(i.n); if (!e) return 0;
  switch (unitKind(i.u)) {
    case "g":  return e.g != null ? e.g * q / 100 : 0;
    case "kg": return e.g != null ? e.g * q * 10 : 0;
    case "cl": return e.g != null ? e.g * q / 10 : 0;
    case "l":  return e.g != null ? e.g * q * 10 : 0;
    case "c":  return e.c != null ? e.c * q : (e.g != null ? e.g * q * 5 / 100 : 0);
    case "s":  return e.c != null ? e.c * 3 * q : (e.g != null ? e.g * q * 15 / 100 : 0);
    case "p":  return e.p != null ? e.p * q : 0;
    default: return 0;
  }
}
function kcalOf(obj){ if (!obj || !obj.ing) return 0; if (obj.kcalM > 0) return Math.round(obj.kcalM / 10) * 10; return Math.round(obj.ing.reduce((s,i) => s + ingKcal(i), 0) / 10) * 10; }
function aisleOf(name){ const e = lookup(name); return e ? e.a : "Divers"; }

  bistrot:["haricotsverts","poireau","brocoli","choufleur","panais"], burger:["poivron","aubergine"], wrap:["poivron","aubergine"],
  tartine:["poivron","petitspois"], omelette:["poireau","petitspois","aubergine"], salade:["haricotsverts","brocoli","poivron","petitspois"],
  curry:["choufleur","brocoli","aubergine","poivron","panais"]
};
FORMATS.forEach(f => (EXTRA_VEG[f.id] || []).forEach(v => { if (f.v.indexOf(v) < 0) f.v.push(v); }));
["donburi","bistrot","cremeuses"].forEach(id => { const f = FORMATS.find(x => x.id === id); if (f && f.k < 2) f.k = 2; });
/* les légumes de saison sont tirés en priorité */
function vegWeight(k){ const v = VEGS[k]; if (!v.ss) return 1; return v.ss.indexOf(curMonth()) >= 0 ? 4 : .08; }
function pickVeg(f, not){
  const cs = combos(f.v, f.k).filter(c => !not || c.join() !== not.join()); if (!cs.length) return null;
  const ws = cs.map(c => c.reduce((p, k) => p * vegWeight(k), 1)); let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cs.length; i++) { r -= ws[i]; if (r <= 0) return cs[i]; }
  return cs[cs.length - 1];
}
function combos(arr, k){
  if (k === 1) return arr.map(x => [x]);
  const out = []; for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++) out.push([arr[i],arr[j]]); return out;
}
function formatProteins(f){ return f.p || Object.keys(PROTEINS); }
function countVariations(){
  return FORMATS.reduce((t,f) => t + formatProteins(f).length * f.s.length * combos(f.v,f.k).length * f.sa.length, 0);
}
function scaleQ(q, m){ if (q === "" || q == null || !m || m === 1) return q; const r = Math.round(q * m / 5) * 5; return r || q; }

/* texte d'une étape de cuisson : feu, geste, repères, contrôle, erreur */
function cookStep(c){
  return (c.feu ? cap(c.feu) + ". " : "") + c.cook + (c.rep ? " Repères : " + c.rep + "." : "") +
    (c.ctl ? " Point de contrôle : " + c.ctl + "." : "") + (c.err ? " À éviter : " + c.err + "." : "");
}
const de = s => /^[aeiouhéèêœ]/i.test(s) ? "d'" + s : "de " + s;
function qtyList(ing){
  return ing.map(([n, q, u]) => q === "" || q == null ? n + " (" + u + ")"
    : String(q).replace(".", ",") + " " + u + " " + de(n)).join(", ");
}

function buildGen(g){
  const f = FORMATS.find(x => x.id === g.f), P = PROTEINS[g.p], S = STARCHES[g.s], Sa = SAUCES[g.sa];
  const V = g.v.map(v => VEGS[v]);
  const ing = [];
  const add = (arr, m) => arr.forEach(([n,q,u]) => {
    const ex = ing.find(i => norm(i.n) === norm(n) && norm(i.u) === norm(u) && q !== "");
    if (ex) ex.q = Math.round((parseFloat(ex.q) + parseFloat(q)) * 100) / 100;
    else ing.push({ n, q: m ? scaleQ(q, m) : q, u });
  });
  add(P.ing, f.pm); add(S.ing); V.forEach(v => add(v.ing)); add(Sa.ing); add(f.x);
  const vegNames = V.map(v => v.n);
  const name = `${f.n} ${P.n}, ${vegNames.join(" & ")}`;
  const uniq = a => [...new Set(a.filter(Boolean))];
  const mats = uniq([P.mat, S.mat, ...V.map(v => v.mat), Sa.mat, f.mat]).join(" ; ");
  const outs = uniq([P.out, S.out]).join(", ");
  const steps = [
    "Avant de commencer — Ustensiles : " + mats + ". " + (outs ? "À sortir du frigo : " + outs + ", pour qu'ils ne soient pas glacés à la cuisson. " : "") + "Préparer une assiette chaude pour réserver et un torchon propre à portée de main.",
    "Découpe, " + low(P.h) + " — " + cap(P.mp) + ".",
    ...V.map(v => "Découpe, " + low(v.h) + " — " + cap(v.cut) + "."),
    "La sauce " + Sa.n + " — Quantités : " + qtyList(Sa.ing) + ". " + Sa.prep + " Texture visée : " + Sa.tex + ". À éviter : " + Sa.err + ".",
    S.h + " — " + cookStep(S),
    ...V.map(v => v.h + " — " + cookStep(v)),
    P.h + " — " + cookStep(P),
    "L'assemblage — " + f.core,
    "Dressage — " + f.a,
    "Finition — " + f.fin,
    "Organisation — À l'avance : " + [S.keep, P.keep, f.orga].join(" ")
  ];
  const t = Math.round((12 + S.t + P.t + V.reduce((x, v) => x + v.t, 0) * 0.6) / 5) * 5;
  return { name, sub: `${cap(S.n)}, sauce ${Sa.n}`, st: f.st, cat: P.cat, base: S.base, t, d: f.d, ing, steps, tip: f.tip, gen: { ...g } };
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function low(s){ return s.charAt(0).toLowerCase() + s.slice(1); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* filtres : {cats:[...], bases:[...], styles:[...]} (vides = tout) */
function randomGen(filters = {}, tries = 80){
  const cats = filters.cats || [], bases = filters.bases || [], styles = filters.styles || [];
  for (let t = 0; t < tries; t++){
    const fl = FORMATS.filter(f => (!styles.length || styles.includes(f.st)) && f.s.some(s => !bases.length || bases.includes(STARCHES[s].base)));
    if (!fl.length) return null;
    const f = pick(fl);
    const ps = formatProteins(f).filter(p => !cats.length || cats.includes(PROTEINS[p].cat));
    const ss = f.s.filter(s => !bases.length || bases.includes(STARCHES[s].base));
    if (!ps.length || !ss.length) continue;
    const g = { f: f.id, p: pick(ps), s: pick(ss), v: pickVeg(f), sa: pick(f.sa) };
    const m = buildGen(g);
    if (kcalOf(m) <= 850) return m;
  }
  return null;
}
function swapGen(meal, key, value){
  const g = { ...meal.gen }; const f = FORMATS.find(x => x.id === g.f);
  if (key === "p") g.p = value; if (key === "s") g.s = value; if (key === "sa") g.sa = value;
  if (key === "f") {
    const nf = FORMATS.find(x => x.id === value); g.f = value;
    if (!formatProteins(nf).includes(g.p)) g.p = pick(formatProteins(nf));
    if (!nf.s.includes(g.s)) g.s = pick(nf.s);
    if (!nf.sa.includes(g.sa)) g.sa = pick(nf.sa);
    g.v = pickVeg(nf);
  }
  if (key === "v") g.v = pickVeg(f, g.v) || g.v;
  return buildGen(g);
}

/* ---------- construction des objets ---------- */
function recipeToState(r){ return { ...clone(r), ing: r.ing.map(i => ({ id: uid(), ...i })), own: !!r.own }; }
function mealFromRecipe(r){
  return { id: uid(), name: r.n, recipeId: r.id, cat: r.cat, st: r.st, base: r.base,
    t: r.t, d: r.d, ing: r.ing.map(i => ({ id: uid(), n: i.n, q: i.q, u: i.u })), steps: [...r.steps], tip: r.tip || "", kcalM: r.kcalM || 0, tc: r.tc || 0 };

    t: m.t, d: m.d, ing: m.ing.map(i => ({ id: uid(), n: i.n, q: i.q, u: i.u })), steps: [...m.steps], tip: m.tip || "", gen: m.gen };

function copyDayMeals(p){ const o = {}; SLOTS.forEach(s => o[s.k] = p[s.k] ? copyMeal(p[s.k]) : null); return o; }
function copyMeal(m){ const c = clone(m); c.id = uid(); c.ing.forEach(i => i.id = uid()); return c; }
function emptyDay(name){ return { id: uid(), name, meals: { l: null, d: null } }; }
function recipeById(id){ return S.recipes.find(r => r.id === id); }

function buildDefaultPlan(recipes){
  const order = ["Saumon & poisson","Bœuf","Œufs","Poulet","Crevettes","Jambon & dinde","Végétarien"];
  const buckets = order.map(c => recipes.filter(r => r.cat === c));
  const seq = [];
  while (buckets.some(b => b.length)) buckets.forEach(b => { if (b.length) seq.push(b.shift()); });
  const weeks = []; let k = 0;
  for (let w = 0; w < 4; w++){
    const days = [];
    for (let d = 0; d < 7; d++){
      const day = emptyDay(DAY_NAMES[d]);
      day.meals.l = mealFromRecipe(seq[k++ % seq.length]);
      day.meals.d = mealFromRecipe(seq[k++ % seq.length]);
      days.push(day);
    }
    weeks.push({ id: uid(), name: "Semaine " + (w + 1), days });
  }
  return weeks;
}
function defaultState(){
  const recipes = DEFAULT_RECIPES.map(recipeToState);
  return { v: 5, font: "editorial", recipes, weeks: buildDefaultPlan(recipes), weights: [], goal: 73, checked: {}, ui: { view: "plan", week: 0 },

/* Migration vers la v3 : plus de collations, sauce retirée du moteur, fiches détaillées.
   Conserve les pesées, les recettes perso et le planning. */
const REPLACED_IDS = { "poulet-satay": "poulet-sesame-coco" };   // recette remplacée
const REFRESH_ING = ["oeufs-butternut"];                          // ingrédients à mettre à jour
function migrate(){
  const defs = {}; DEFAULT_RECIPES.forEach(r => defs[r.id] = r);
  // carnet : on retire petit-déjeuner et collations non personnels, et la recette remplacée
  S.recipes = S.recipes.filter(r => r.own || !(["Petit-déjeuner","Collation"].includes(r.cat) || REPLACED_IDS[r.id]));
  S.recipes.forEach(r => { const d = defs[r.id]; if (d && !r.own) {
    r.steps = [...d.steps]; r.tip = d.tip || ""; r.t = d.t; r.d = d.d;
    if (REFRESH_ING.includes(r.id)) { r.n = d.n; r.ing = d.ing.map(i => ({ id: uid(), ...i })); } } });
  const have = new Set(S.recipes.map(r => r.id));
  DEFAULT_RECIPES.forEach(r => { if (!have.has(r.id)) S.recipes.push(recipeToState(r)); });
  // planning : plus de collation ; fiches détaillées ; recettes remplacées
  S.weeks.forEach(w => w.days.forEach(d => {
    d.meals = d.meals || {}; delete d.meals.b; delete d.meals.c;
    ["l","d"].forEach(k => {
      const m = d.meals[k]; if (m === undefined) { d.meals[k] = null; return; } if (!m) return;
      const nid = REPLACED_IDS[m.recipeId];
      if ((nid || REFRESH_ING.includes(m.recipeId)) && defs[nid || m.recipeId]) { const nm = mealFromRecipe(defs[nid || m.recipeId]); nm.id = m.id; d.meals[k] = nm; return; }
      if (m.recipeId && defs[m.recipeId]) { const df = defs[m.recipeId]; m.steps = [...df.steps]; m.tip = df.tip || ""; m.t = df.t; m.d = df.d; return; }
      if (m.gen) { try {
        if (!SAUCES[m.gen.sa]) { m.gen.sa = "sojasesame"; const nm = mealFromGen(buildGen(m.gen)); nm.id = m.id; d.meals[k] = nm; return; }
        const g = buildGen(m.gen); m.steps = g.steps; m.tip = g.tip; m.t = g.t; m.d = g.d; } catch (e) {} }
    });
  }));
  S.v = 3; S.font = S.font || "editorial";
}

function weekAvg(week){ const ds = week.days.filter(d => d.meals.l || d.meals.d); if (!ds.length) return 0; return Math.round(ds.reduce((s, d) => s + dayKcal(d), 0) / ds.length / 10) * 10; }

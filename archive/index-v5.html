<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>La Table d'Olivier</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --card:#FFFFFF; --ink:#1D1C1A; --ink-2:#3A3834; --mute:#7B776F;
  --line:#E5E2DB; --line-2:#CFCAC0; --celadon:#56766A; --wash:#EEF3EF; --danger:#9B4A3C;
  /* une couleur par catégorie de plat */
  --c-poisson:#C4674B; --c-crevettes:#D08A7A; --c-poulet:#C8963E; --c-boeuf:#7E3B3B;
  --c-jambon:#B06A45; --c-oeufs:#D4A93C; --c-veg:#6F8F6A;
  --cc:var(--celadon);
  --serif:"Cormorant Garamond","Cormorant",Garamond,Georgia,serif;
  --sans:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --serif-w:500; --fsa:.47; --title-ls:0;
  --r:999px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--celadon);outline-offset:2px}
.muted{color:var(--mute)} .small{font-size:12.5px} .center{text-align:center;padding:40px 0}
.danger{color:var(--danger)!important}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(250,250,247,.94);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:baseline;gap:40px;padding:18px 32px}
.brand{font:italic 400 26px/1 var(--serif);letter-spacing:.01em;white-space:nowrap}
/* menu du bas (smartphone) : pastille colorée par rubrique */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;gap:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);backdrop-filter:saturate(1.2) blur(8px);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(29,28,26,.06)}
.tabbar button{--nf:#fff;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;font-size:10.5px;letter-spacing:.02em;color:var(--mute);white-space:nowrap;transition:color .2s;-webkit-tap-highlight-color:transparent}
.tabbar .ico{display:grid;place-items:center;width:46px;height:32px;border-radius:16px;background:color-mix(in srgb,var(--nc) 16%,transparent);transition:background .2s,transform .15s}
.tabbar svg{width:22px;height:22px;fill:none;stroke:var(--nc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.tabbar button:active .ico{transform:scale(.9)}
.tabbar button[aria-current="page"]{color:color-mix(in srgb,var(--nc) 70%,var(--ink));font-weight:500}
.tabbar button[aria-current="page"] .ico{background:var(--nc);box-shadow:0 4px 10px color-mix(in srgb,var(--nc) 40%,transparent);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.tabbar button[aria-current="page"] svg{stroke:var(--nf)}
@keyframes pop{0%{transform:scale(.8) translateY(3px)}60%{transform:scale(1.12) translateY(-3px)}100%{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:1px solid var(--line-2);border-radius:var(--r);font-size:13.5px;font-weight:500;background:transparent;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--ink-2)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.big{padding:14px 34px;font-size:15px}
.btn.file{cursor:pointer}
.link{color:var(--celadon);font-size:13px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s}
.link:hover{text-decoration-color:currentColor}
.icon{width:30px;height:30px;border-radius:50%;color:var(--mute);font-size:15px;line-height:1}
.icon:hover:not(:disabled){background:var(--wash);color:var(--ink)}
.icon:disabled{opacity:.25;cursor:default}
.icon.del:hover{color:var(--danger);background:#F6ECEA}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* titres */
.display{font:400 44px/1.08 var(--serif);margin:0 0 8px;letter-spacing:-.005em}
.display-s{font:400 30px/1.15 var(--serif);margin:0 0 10px}
.eyebrow{font-size:12.5px;color:var(--mute);margin:0 0 6px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.pagehead p{max-width:62ch;margin:0}
.group-title{font:italic 400 22px/1.2 var(--serif);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.book-group .group-title{border-bottom-color:var(--cc);display:flex;align-items:center;gap:10px}
.book-group .group-title::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}

/* couleur de catégorie */
.cat-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.04em;padding:2px 10px 2px 8px;border-radius:var(--r);
  color:color-mix(in srgb,var(--cc) 68%,var(--ink));background:color-mix(in srgb,var(--cc) 12%,transparent);white-space:nowrap}
.cat-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cc)}

/* semaines */
.weekbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:34px;scrollbar-width:thin}
.wtab{padding:8px 16px;border-radius:var(--r);font-size:13.5px;color:var(--mute);white-space:nowrap;border:1px solid transparent}
.wtab:hover{color:var(--ink)}
.wtab[aria-current="true"]{color:var(--ink);border-color:var(--celadon)}
.wtab.add{color:var(--celadon)}
.weekhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.weekhead p{margin:4px 0 0}
.title-input{font:400 52px/1.05 var(--serif);border:0;background:transparent;padding:0;width:100%;max-width:560px;border-bottom:1px solid transparent}
.title-input:hover,.title-input:focus{border-bottom-color:var(--line-2);outline:none}

/* jours */
.day{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:30px 0;border-top:1px solid var(--line)}
.day:last-child{border-bottom:1px solid var(--line)}
.day-head{display:flex;flex-direction:column;gap:4px}
.day-name{font:italic 400 28px/1.1 var(--serif);border:0;background:transparent;padding:0;width:100%;border-bottom:1px solid transparent}
.day-name:hover,.day-name:focus{border-bottom-color:var(--line-2);outline:none}
.day-name.static{display:block}
.day-tools{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:10px}
.meals{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.meal{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal.has-cat{border-left:2px solid var(--cc);padding-left:16px}
.slot{font-size:12.5px;color:var(--mute);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.slot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-poulet)}
.slot-d .slot::before,.slot.slot-d::before{background:var(--celadon)}
.day-name{color:color-mix(in srgb,var(--celadon) 65%,var(--ink))}
.wtab[aria-current="true"]{background:color-mix(in srgb,var(--celadon) 10%,transparent)}
.group-title{border-bottom-color:color-mix(in srgb,var(--celadon) 35%,var(--line))}
.stat-v{color:color-mix(in srgb,var(--celadon) 60%,var(--ink))}
.meal-tools .link{color:color-mix(in srgb,var(--cc) 70%,var(--ink))}
.dish{text-align:left;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.dish-name{font:400 19px/1.28 var(--serif);color:var(--ink);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;text-decoration-thickness:1px;transition:text-decoration-color .15s}
.dish:hover .dish-name{text-decoration-color:var(--cc)}
.dish-sub{font-size:13px;color:var(--ink-2)}
.dish-meta{font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.meal-tools{display:flex;gap:14px;opacity:0;transition:opacity .15s}
.meal:hover .meal-tools,.meal:focus-within .meal-tools{opacity:1}
@media (hover:none){.meal-tools{opacity:1}}
.meal.empty .create{text-align:left;color:var(--celadon);font-size:14px;padding:12px 0;border-top:1px dashed var(--line-2)}
.meal.empty .create:hover{color:var(--ink)}
.add-day{padding:30px 0}
.empty-state{padding:80px 0;text-align:center}

/* feuille latérale */
.modal{position:fixed;inset:0;z-index:50;background:rgba(29,28,26,0);transition:background .25s}
.modal.open{background:rgba(29,28,26,.3)}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--paper);overflow-y:auto;box-shadow:-24px 0 60px rgba(29,28,26,.12);transform:translateX(24px);opacity:0;transition:transform .28s cubic-bezier(.2,.7,.2,1),opacity .2s}
.sheet.wide{width:min(940px,100%)}
.modal.open .sheet{transform:none;opacity:1}
.sheet-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:14px 18px 0;background:linear-gradient(var(--paper) 70%,transparent)}
.sheet-body{padding:6px 44px 44px}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.push{margin-left:auto}

/* éditeur */
.ed-title{font:400 34px/1.15 var(--serif);border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;width:100%;padding:4px 0 10px;margin:0;resize:none;overflow:hidden;display:block}
.ed-title:focus{outline:none;border-bottom-color:var(--ink)}
.ed-title.static{border:0}
.ed-sub{margin:8px 0 0;color:var(--ink-2)}
.ed-kcal{margin:14px 0 0;font-size:13.5px}
.ed-sec{margin-top:30px}
.ed-sec h3,.gen-panel h3{font:italic 400 20px/1.2 var(--serif);margin:0 0 10px}
.gen-panel{margin-top:26px;padding:20px 22px;background:var(--wash);border-radius:4px}
.gen-panel p{margin:0 0 12px}
.fields{display:flex;flex-wrap:wrap;gap:14px 18px;margin:18px 0 8px}
.gen-panel .fields{margin:0 0 10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mute);min-width:130px}
.field input,.field select,select,.search,textarea{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:9px 11px;color:var(--ink);font-size:14px}
.field input:focus,select:focus,.search:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{width:100%;resize:vertical;line-height:1.6}
.ing-list{list-style:none;margin:0 0 14px;padding:0}
.ing{display:grid;grid-template-columns:64px 118px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ing input{border:0;background:transparent;padding:7px 6px;border-radius:3px;min-width:0;font-size:14.5px}
.ing input:hover{background:var(--card)}
.ing input:focus{outline:none;background:var(--card);box-shadow:inset 0 0 0 1px var(--ink)}
.ing-q{text-align:right}
.ing-empty{padding:12px 0}
.ing-tools{display:flex;gap:2px}
.steps{list-style:none;counter-reset:st;padding:0;margin:0}
.steps li{counter-increment:st;display:grid;grid-template-columns:44px 1fr;column-gap:6px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st, decimal-leading-zero);grid-row:1 / span 2;font:400 13px/1.9 var(--sans);letter-spacing:.08em;color:var(--cc)}
.steps li.muted::before{content:none}
.step-h{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--cc) 80%,var(--ink));font-weight:500;margin-bottom:4px}
.steps p{margin:0;color:var(--ink-2);line-height:1.7;max-width:68ch}
.steps .lab{font-weight:500;color:var(--ink);font-size:.82em;letter-spacing:.08em;text-transform:uppercase}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:6px}
.sec-head h3{margin:0}
.ed-kcal .sep{display:inline-block;width:18px;height:1px;background:var(--line-2);vertical-align:middle;margin:0 12px}
.font-list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 40px}
.font-opt{text-align:left;padding:22px 22px 20px;border:1px solid var(--line);border-radius:4px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.font-opt:hover{border-color:var(--ink-2)}
.font-opt[aria-pressed="true"]{border-color:var(--celadon);box-shadow:inset 0 0 0 1px var(--celadon)}
.font-opt .fo-t{font-size:26px;line-height:1.15}
.font-opt .fo-s{font-size:13.5px;color:var(--ink-2)}
.font-opt .fo-n{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
@media (max-width:760px){.font-list{grid-template-columns:1fr}.steps li{grid-template-columns:34px 1fr}}

/* choix */
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.choice{text-align:left;display:flex;flex-direction:column;gap:4px;padding:18px 20px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
button.choice:hover{border-color:var(--celadon)}
.choice strong{font:400 20px/1.2 var(--serif)}
.choice span{color:var(--mute);font-size:13.5px}
.choice .row{display:flex;gap:10px;margin-top:8px}

/* recherche / liste de choix */
.search{width:100%;padding:12px 14px;font-size:15px;margin:10px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 13px;border:1px solid var(--line-2);border-radius:var(--r);font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--cc);flex:none}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pick-list{list-style:none;padding:0;margin:18px 0 0;columns:2;column-gap:36px}
.pick-list li{break-inside:avoid;margin-bottom:8px}
.pick{display:flex;flex-direction:column;text-align:left;padding:10px 14px;border-left:2px solid var(--cc);border-radius:0 3px 3px 0;
  background:color-mix(in srgb,var(--cc) 7%,transparent);width:100%;gap:2px}
.pick:hover .dish-name{text-decoration-color:var(--cc)}

/* propositions */
.filters{display:flex;flex-direction:column;gap:12px;margin:18px 0 22px}
.frow{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start}
.flabel{font-size:12.5px;color:var(--mute);padding-top:7px}
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.prop{background:var(--card);background:color-mix(in srgb,var(--cc) 7%,var(--card));border:1px solid var(--line);border-top:2px solid var(--cc);border-radius:4px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:6px}
.prop h4{margin:0}
.prop p{margin:0}
.prop-tag{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.prop-actions{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:auto;padding-top:12px}

/* inspirations */
.insp-hero{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:end;padding:10px 0 34px;border-bottom:1px solid var(--line);margin-bottom:30px}
.big-figure{font:400 128px/.82 var(--serif);margin:0;letter-spacing:-.03em;color:var(--celadon)}
.lede{font:400 19px/1.5 var(--serif);max-width:52ch;margin:0 0 6px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);padding:3px}
.seg-b{padding:8px 20px;border-radius:var(--r);font-size:14px;color:var(--mute)}
.seg-b[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.insp-go{margin:6px 0 36px}
.apply{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:24px 0;font-size:14px}

/* carnet */
.book-filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:34px}
.book-filters .search{margin:0}
.book-group{margin-bottom:40px}
.book-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;column-gap:48px;row-gap:8px}
.book-item{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-left:2px solid var(--cc);border-radius:0 3px 3px 0;
  background:color-mix(in srgb,var(--cc) 7%,transparent);width:100%}
.book-item:hover .dish-name{text-decoration-color:var(--cc)}

/* courses */
.shop-controls{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;padding:18px 0 28px;border-bottom:1px solid var(--line);margin-bottom:30px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink);cursor:pointer}
input[type=checkbox]{accent-color:var(--celadon);width:16px;height:16px}
.shop-cols{columns:3 280px;column-gap:44px}
.shop-group{break-inside:avoid;margin-bottom:30px}
.shop-list{list-style:none;margin:0;padding:0}
.shop-list label{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.si-q{color:var(--mute);font-size:13px;text-align:right}
.shop-list li.done .si-name{text-decoration:line-through;color:var(--mute)}

/* poids */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}
.stat{padding:22px 0;display:flex;flex-direction:column;gap:4px}
.stat-v{font:400 34px/1 var(--serif)}
.stat-l{font-size:12.5px;color:var(--mute)}
.goal{width:3.2em;font:400 34px/1 var(--serif);border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:0}
.weight-form{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:30px}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--mute);font:11px var(--sans)}
.chart .goal-line{stroke:var(--celadon);stroke-dasharray:4 5;stroke-width:1}
.chart .curve{fill:none;stroke:var(--ink);stroke-width:1.6}
.chart .dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.wlist{list-style:none;padding:0;margin:30px 0 0;max-width:620px}
.wlist li{display:grid;grid-template-columns:1fr 90px 80px 32px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}

/* données */
.data-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-bottom:30px}
.data-grid p{min-height:3em}

/* toast */
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:var(--r);font-size:14px;display:flex;gap:18px;align-items:center;transition:.25s;z-index:80;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .link{color:#BFD3C9}

/* responsive */
@media (max-width:1020px){
  .meals{gap:22px 28px}
  .day{grid-template-columns:150px 1fr}
}
@media (max-width:720px){
  .tabbar{gap:0;padding-left:4px;padding-right:4px}
  .tabbar button{min-width:0;flex:1 1 0;padding:7px 2px 6px;font-size:10.5px}
  .top-in{flex-direction:column;gap:8px;padding:14px 18px 6px}
  main{padding:24px 18px 110px}
  .title-input{font-size:38px}
  .day{grid-template-columns:1fr;gap:14px;padding:24px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.tabbar,.top,.meal-tools,.day-tools,.weekbar,.actions,.add-day{display:none}}

/* accents : vert céladon, bandeau multicolore, mouvement */
html{-webkit-tap-highlight-color:transparent}
.top::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--celadon),var(--c-veg),var(--c-oeufs),var(--c-poulet),var(--c-poisson),var(--c-crevettes),var(--c-boeuf))}
.brand{color:color-mix(in srgb,var(--celadon) 80%,var(--ink))}
.btn.primary{background:var(--celadon);border-color:var(--celadon);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--celadon) 82%,#000)}
.btn:active{transform:scale(.97)}
.chip[aria-pressed="true"],.seg-b[aria-pressed="true"]{background:var(--celadon);border-color:var(--celadon);color:#fff}
.chip[aria-pressed="true"] .dot{background:#fff}
.wtab[aria-current="true"]{background:var(--celadon);border-color:var(--celadon);color:#fff}
.wtab{transition:background .2s,color .2s}
.title-input,.display{color:color-mix(in srgb,var(--celadon) 55%,var(--ink))}
.cat-tag{background:color-mix(in srgb,var(--cc) 18%,transparent)}
.meal.has-cat{background:color-mix(in srgb,var(--cc) 7%,transparent);padding:12px 14px 12px 16px;border-radius:0 12px 12px 0}
.day{transition:background .2s}
.prop,.pick,.book-item{transition:transform .15s,box-shadow .15s}
.prop:active,.pick:active,.book-item:active,.dish:active{transform:scale(.985)}
.prop{box-shadow:0 6px 18px color-mix(in srgb,var(--cc) 12%,transparent)}
#main>*{animation:rise .35s ease both}
.sheet-body h1,.sheet-body h2{color:color-mix(in srgb,var(--celadon) 55%,var(--ink))}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* typographies interchangeables */
html[data-font="modern"]{--serif:"Jost","Futura","Avenir Next",Arial,sans-serif;--sans:"Jost","Futura","Avenir Next",Arial,sans-serif;--serif-w:300;--fsa:none;--title-ls:-.01em}
html[data-font="classic"]{--serif:"Playfair Display",Georgia,serif;--sans:"Karla","Helvetica Neue",Arial,sans-serif;--serif-w:400;--fsa:none;--title-ls:0}
.brand,.display,.display-s,.group-title,.title-input,.day-name,.dish-name,.ed-title,.ed-sec h3,.gen-panel h3,.choice strong,.fo-t{font-weight:var(--serif-w);font-size-adjust:var(--fsa);letter-spacing:var(--title-ls)}
.dish-name{font-weight:var(--serif-w)}

/* ============ v4 : icônes, mode cuisine, objectif calorique, frigo, création ============ */
.sheet-close{padding-top:calc(14px + env(safe-area-inset-top))}
.sheet-body{padding-bottom:calc(44px + env(safe-area-inset-bottom))}
.ico-s{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.sea-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.03em;padding:2px 10px 2px 7px;border-radius:var(--r);color:#3F6B3B;background:color-mix(in srgb,#6F8F6A 18%,transparent);white-space:nowrap}
.sea-chip.off{color:#8A6A2E;background:color-mix(in srgb,#C8963E 16%,transparent)}
.sea-chip .ico-s{width:1em;height:1em}
.ing-sea{display:inline-flex;color:#5E8A59;font-style:normal;margin-left:6px}

/* barre de calories du jour */
.kbar{display:flex;flex-direction:column;gap:5px;margin-top:6px;min-width:150px}
.kb-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.kb-v{color:var(--ink);font-weight:500}.kb-t{color:var(--mute)}
.kb-track{position:relative;height:6px;border-radius:6px;background:var(--line);overflow:visible}
.kb-track i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--celadon);transition:width .3s}
.kb-track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;text-decoration:none}
.kbar.hi .kb-track i{background:#C8963E}.kbar.lo .kb-track i{background:#7B9AA8}
.kb-d{font-size:12px;color:var(--mute)}.kbar.ok .kb-d{color:#4F7A55}

/* mode cuisine */
.cook-title{font:400 36px/1.14 var(--serif);margin:0 0 6px}
.cook-tags{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:10px 0 0}
.cpills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 6px}
.cpill{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cpill .ico-s{color:var(--cc);width:1.3em;height:1.3em;margin-bottom:2px}
.cp-l{font-size:11.5px;color:var(--mute);letter-spacing:.04em}.cpill strong{font:400 21px/1.1 var(--serif)}
.cook-note{font-size:13px;color:#8A6A2E;margin:10px 0 0}
.ed-sec h3 .ico-s{color:var(--cc);margin-right:6px}
.cook-ings{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.cook-ings li{display:grid;grid-template-columns:minmax(84px,max-content) 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.cook-ings b{font-weight:500;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.side-panel{padding:16px 18px;background:var(--wash);border-radius:12px}
.chip.side{gap:5px}.chip.side .ico-s{width:1em;height:1em}
.cook-fold{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:0 16px;background:var(--card)}
.cook-fold summary{cursor:pointer;padding:13px 0;font-size:14px;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px}
.cook-fold summary::-webkit-details-marker{display:none}
.cook-fold p{margin:0 0 14px;color:var(--ink-2);line-height:1.7}
.cprog{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--mute)}
.cprog-bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.cprog-bar i{display:block;height:100%;background:var(--cc);transition:width .25s}
.cook-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cstep{display:grid;grid-template-columns:46px 1fr;gap:12px;padding:16px 16px 16px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);transition:opacity .2s,border-color .2s,background .2s}
.cstep.done{opacity:.55;border-color:transparent;background:color-mix(in srgb,var(--cc) 8%,var(--card))}
.cstep.done h4{text-decoration:line-through;text-decoration-color:var(--cc)}
.chk{position:relative;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--cc);display:grid;place-items:center;color:var(--cc);background:transparent;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent}
.chk .cn{font:500 15px/1 var(--sans)}.chk .ico-s{position:absolute;opacity:0;width:20px;height:20px;stroke-width:2.2}
.chk[aria-pressed="true"]{background:var(--cc);color:#fff}.chk[aria-pressed="true"] .cn{opacity:0}.chk[aria-pressed="true"] .ico-s{opacity:1}
.cs-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.cs-head h4{margin:0;font:500 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--cc) 80%,var(--ink))}
.dur{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r);background:color-mix(in srgb,var(--cc) 12%,transparent);color:color-mix(in srgb,var(--cc) 70%,var(--ink));font-size:13px;font-variant-numeric:tabular-nums;min-height:32px}
.dur.run{background:var(--cc);color:#fff}
.cs-short{margin:6px 0 0;font-size:16px;line-height:1.55;color:var(--ink)}
.cs-more{margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.cs-more summary{cursor:pointer;color:var(--celadon);font-size:13px;list-style:none}
.cs-more summary::-webkit-details-marker{display:none}
.cs-more p{margin:8px 0 0;line-height:1.65}
.recall{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rc{font-size:12.5px;padding:3px 10px;border-radius:var(--r);background:var(--wash);color:var(--ink-2)}.rc b{font-weight:500;color:var(--ink)}
.tip p{margin:0;color:var(--ink-2);font:italic 400 18px/1.5 var(--serif)}

/* calories : réglages */
.goalbox{padding:20px 22px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:6px 0 16px;display:flex;flex-direction:column;gap:14px}
.goalbox p{margin:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .icon{width:44px;height:44px;border:1px solid var(--line-2)}.stepper .icon .ico-s{width:18px;height:18px}
.kg-in{width:4.2em;font:400 40px/1 var(--serif);text-align:center;border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:2px 0;color:var(--ink)}
.check.sw{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:14.5px}
.check.sw input{width:20px;height:20px}

/* frigo */
.ins-mode{margin-bottom:24px}
.fr-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:18px}
.fr-box .group-title{display:flex;align-items:center;gap:8px}
.chip.fr{min-height:36px}.chip.fr .ico-s{width:.95em;height:.95em}
.fr-add{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 30px}
.fr-add .search{margin:0;flex:1 1 240px;width:auto}.fr-add select{padding:11px}
.fr-head{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:center;margin-bottom:14px}
.fr-head .group-title{border:0;margin:0;padding:0}
.fr-score{display:flex;align-items:center;gap:12px}
.fs-bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}.fs-bar i{display:block;height:100%;background:var(--celadon)}
.fr-score strong{font:400 20px/1 var(--serif);min-width:3em;text-align:right}

/* courses : ajouts */
.ex-add{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 6px}
.ex-add .search{margin:0;flex:1 1 280px;width:auto}
.shop-list li{position:relative}.shop-list li.ex label{padding-right:34px}.shop-list li .icon.del{position:absolute;right:-4px;top:4px}

/* création de recette */
.creator .ed-title{margin-bottom:6px}
.cr-sec{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.cr-sec h3{display:flex;align-items:center;gap:10px;font:italic 400 21px/1.2 var(--serif);margin:0 0 6px}
.cr-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--cc) 14%,transparent);color:color-mix(in srgb,var(--cc) 75%,var(--ink));font-style:normal}
.cr-sec .small{margin:0 0 12px}
.cr-gap{margin-top:12px}
.cr-list{list-style:none;margin:10px 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.cr-q{display:inline-flex;align-items:center;gap:4px}
.cr-q .icon{width:40px;height:40px;border:1px solid var(--line-2);border-radius:50%}.cr-q .ico-s{width:17px;height:17px}
.cr-q input{width:4.2em;text-align:center;padding:10px 4px}
.cr-q.big strong{font:400 34px/1 var(--serif);min-width:3.4em;text-align:center}
.cr-ing{display:grid;grid-template-columns:auto 118px 1fr auto auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cr-ing input,.cr-ing select,.cr-step input,.cr-step textarea{padding:11px 10px;font-size:15px;min-height:44px}
.cr-k{font-size:12px;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.cr-step{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cr-num{font:500 13px/44px var(--sans);color:var(--cc);text-align:center}
.cr-sb{display:flex;flex-direction:column;gap:8px}
.cr-sd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cr-sd .cr-q strong{min-width:3.6em;text-align:center;font-weight:500}
.cr-tools{display:inline-flex;gap:2px}.cr-tools .icon{width:40px;height:40px}.cr-tools .ico-s{width:17px;height:17px}
.cr-kc{margin:6px 0 10px}.cr-kc strong{font:400 24px/1 var(--serif)}
.cr-sec .check{display:flex;align-items:center;gap:10px;font-size:14.5px}

@media (max-width:720px){
  .cpills{grid-template-columns:1fr 1fr}
  .cook-title{font-size:30px}
  .cook-ings{grid-template-columns:1fr}
  .cstep{grid-template-columns:44px 1fr;padding:14px 12px}
  .cs-short{font-size:16.5px}
  .fr-grid{grid-template-columns:1fr}
  .cr-ing{grid-template-columns:auto 1fr auto;grid-template-areas:"q q q" "u n d" "k k k"}
  .cr-ing .cr-q{grid-area:q}.cr-ing select{grid-area:u}.cr-ing .cr-n{grid-area:n}.cr-ing .icon.del{grid-area:d}.cr-ing .cr-k{grid-area:k}
  .goalbox{padding:16px}
  .kg-in{font-size:34px}
}

/* ============ v5 : boutons explicites, recette modifiable, smartphone ============ */
button,.btn,.chip,.mt,.dt,.wa,.mini,.mini-add,.qb,.qx,.chk,.dur{touch-action:manipulation}
/* actions de la semaine */
.wa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.wa{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);min-height:76px;transition:border-color .15s,transform .15s}
.wa:hover{border-color:var(--celadon)}.wa:active{transform:scale(.98)}
.wa .ico-s{width:24px;height:24px;color:var(--celadon);flex:none;margin-top:2px}
.wa strong{display:block;font-weight:500;font-size:15px;color:var(--ink);line-height:1.25}
.wa em{display:block;font-style:normal;font-size:12.5px;color:var(--mute);line-height:1.35;margin-top:2px}
.wa-del{margin-top:6px;min-height:36px}
.weekhead{align-items:stretch}.weekhead>div:last-child{flex:1 1 440px;max-width:640px}
/* jour */
.day-tools{flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:10px}
.dt{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r);font-size:13px;color:var(--ink-2);min-height:40px}
.dt:hover{border-color:var(--ink)}.dt .ico-s{width:1.05em;height:1.05em}
.dt.danger{border-color:transparent}
/* repas */
.meal-tools{opacity:1!important;display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:6px;margin-top:6px}
.mt{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r);font-size:13px;color:var(--ink-2);background:var(--card);min-height:40px;justify-content:center}
.mt:hover{border-color:var(--ink)}.mt .ico-s{width:1.05em;height:1.05em}.mt.danger{color:var(--danger)}
.mb{font-size:11.5px;padding:2px 9px;border-radius:var(--r);background:var(--wash);color:var(--ink-2);white-space:nowrap}
/* recette modifiable */
.ci-list{list-style:none;margin:8px 0 10px;padding:0}
.ci{display:grid;grid-template-columns:1fr auto 40px;gap:2px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);border-radius:8px}
.ci-n{font-size:16px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.qs{display:inline-flex;align-items:center;gap:4px}
.qb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink);background:var(--card)}
.qb:hover{border-color:var(--ink)}.qb:active{background:var(--wash)}.qb .ico-s,.qx .ico-s{width:17px;height:17px}
.qv{min-width:4.4em;text-align:center;font-size:14.5px;font-variant-numeric:tabular-nums;font-weight:500}
.qx{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.qx:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.ci.vg{grid-template-areas:"n s x" "m m m"}.ci.vg .ci-n{grid-area:n}.ci.vg .qs{grid-area:s}.ci.vg .qx{grid-area:x}.ci.vg .mini{grid-area:m;justify-self:start;margin-top:2px}
.ci.vg .vg-panel{grid-column:1/-1}
.mini{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--line-2);font-size:13px;color:var(--celadon);min-height:36px;background:var(--card)}
.mini:hover{border-color:var(--celadon)}.mini .ico-s{width:1em;height:1em}
.mini-add{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--r);border:1px dashed var(--celadon);color:var(--celadon);font-size:14px;min-height:44px}
.mini-add:hover{background:var(--wash)}
.vg-panel{margin:8px 0 4px;padding:12px 14px;background:var(--wash);border-radius:12px}
.vg-panel p{margin:0 0 8px}
.vg-other{margin-top:10px}.vg-other summary{cursor:pointer;color:var(--mute);font-size:13px;min-height:32px}
.chip.side.off{opacity:.75;border-style:dashed}
.add-form{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.add-form input,.add-form select{padding:12px;font-size:16px;min-height:46px}
.add-row{display:grid;grid-template-columns:90px 1fr auto;gap:8px}
.slot-target{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 14px;border-radius:12px;font-size:13.5px;margin:12px 0 0;background:var(--wash)}
.slot-target.hi{background:color-mix(in srgb,#C8963E 14%,transparent)}.slot-target.lo{background:color-mix(in srgb,#7B9AA8 16%,transparent)}
.ci.flash,.cstep.flash{animation:flash 2.2s ease}
@keyframes flash{0%,60%{background:color-mix(in srgb,var(--celadon) 22%,transparent)}100%{background:transparent}}
.sans{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sans span{font-size:12px;padding:2px 10px;border-radius:var(--r);background:color-mix(in srgb,#C8963E 18%,transparent);color:#8A6A2E}
/* ce qui a changé */
.chg-banner{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;margin:18px 0 0;padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:4px;font-size:14px}
.chg-banner .cb-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chg-banner strong{font-weight:500;font-size:15px}
.chg-banner .qx{color:var(--paper);opacity:.7;width:32px;height:32px}
.chg-banner span{opacity:.92;line-height:1.4}
.chg-banner .link{color:#BFD3C9;align-self:flex-start;min-height:34px;font-size:14px}
.rep-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rep-list>li{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.rep-h{margin:0 0 4px;display:flex;flex-direction:column;gap:1px}.rep-d{font-size:12px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.rep-list ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px;line-height:1.55}
/* smartphone */
@media (max-width:720px){
  .wa-grid{grid-template-columns:1fr 1fr;gap:8px}.wa{flex-direction:column;gap:6px;padding:12px}
  .meal-tools{grid-template-columns:1fr 1fr;gap:8px}.mt{min-height:44px}
  .day-tools{width:100%}.dt{flex:1 1 auto;justify-content:center;min-height:44px}
  .ci{grid-template-columns:1fr auto 40px}
  .qv{min-width:3.8em}
  .sheet{width:100%}.sheet-body{padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .sheet-foot{position:sticky;bottom:0;margin:22px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:4}
  .sheet-foot .btn{justify-content:center;min-height:46px}.sheet-foot .push{grid-column:1/-1;order:-1}
  .chg-banner{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .btn{min-height:44px}.chip{min-height:40px}
  .cstep{padding:14px 12px}.cs-more summary{min-height:40px;display:flex;align-items:center}
}

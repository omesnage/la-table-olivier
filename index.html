  const tabs = S.weeks.map((wk, i) => `<button class="wtab" data-act="week" data-i="${i}" aria-current="${i === S.ui.week}">${esc(wk.name)}</button>`).join("");
  if (!w) return `<div class="weekbar">${tabs}<button class="wtab add" data-act="newWeek">＋ Créer une nouvelle semaine</button></div>
    <div class="empty-state"><p class="display-s">Aucune semaine pour l'instant.</p><button class="btn primary" data-act="newWeek">＋ Créer une nouvelle semaine</button></div>`;
  const days = w.days.map((d, di) => dayBlock(d, di)).join("");
  return `
  <div class="weekbar" role="tablist">${tabs}<button class="wtab add" data-act="newWeek">＋ Créer une nouvelle semaine</button></div>
  <header class="weekhead">
    <div>
      <input class="title-input" data-bind="weekName" value="${esc(w.name)}" aria-label="Nom de la semaine">
      <p class="muted">${w.days.length} jour${w.days.length > 1 ? "s" : ""}, environ ${fmtK(weekAvg(w))} kcal par jour pour le déjeuner et le dîner · cible ${fmtK(dayTarget())} kcal (${fmtK(kcalGoal())} kcal × ${S.kcalShare || 60} %)</p>
    </div>
    ${weekActions(w)}
  </header>
  <div class="days">${days}</div>
  <div class="add-day"><button class="btn" data-act="newDay">＋ Créer un nouveau jour</button></div>`;
}
function dayBlock(d, di){
  const meals = SLOTS.map(sl => mealCell(d.meals[sl.k], sl, di)).join("");
  return `<article class="day">
    <div class="day-head">
      <input class="day-name" data-bind="dayName" data-d="${di}" value="${esc(d.name)}" aria-label="Nom du jour">
      ${kcalBar(d)}
      ${dayTools(d, di)}
    </div>
    ${pdjRow(d, di)}<div class="meals">${meals}</div>
  </article>`;
}
function mealCell(m, sl, di){
  const at = `data-d="${di}" data-s="${sl.k}"`;
  if (!m) return `<div class="meal empty slot-${sl.k}"><div class="slot">${sl.label}</div>
    <button class="create" data-act="createMeal" ${at}>＋ ${sl.create}</button></div>`;
  const cls = CAT_KEY[m.cat] ? " has-cat" : "";
  const meta = [m.st || "", kcalOf(m) ? "≈ " + fmtK(kcalOf(m)) + " kcal" : ""].filter(Boolean).join(", ");
  return `<div class="meal slot-${sl.k}${cls}" ${catSt(m.cat)}><div class="slot">${sl.label}</div>
    <button class="dish" data-act="openMeal" ${at}><span class="dish-name">${esc(m.name || "Repas sans nom")}</span>
    ${m.sub ? `<span class="dish-sub">${esc(m.sub)}</span>` : ""}<span class="dish-meta">${catTag(m.cat)}${seasonChip(m)}<span>${esc(meta)}</span></span>${mealBadges(m)}</button>
    ${mealTools(at)}</div>`;
}

/* ============ MODALE ============ */
let MODAL = null; // { target, kind }
function openModal(html, opts = {}){
  const m = $("#modal");
  m.querySelector(".sheet").className = "sheet" + (opts.wide ? " wide" : "");
  m.querySelector(".sheet-body").innerHTML = html;
  m.hidden = false; document.body.classList.add("locked");
  requestAnimationFrame(() => { m.classList.add("open"); fitTitle(); });
  if (opts.focus) { const f = m.querySelector(opts.focus); if (f) f.focus(); }
}
function closeModal(){
  const m = $("#modal"); m.classList.remove("open"); m.hidden = true; document.body.classList.remove("locked");
  if (MODAL && MODAL.kind === "meal") { const o = getMeal(MODAL.t); if (o && !o.name.trim()) o.name = "Repas sans nom"; }
  MODAL = null; if (S.ui) delete S.ui.open; save(); render();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });

function getMeal(t){ const w = S.weeks[t.w]; return w && w.days[t.d] ? w.days[t.d].meals[t.s] : null; }
function setMeal(t, m){ S.weeks[t.w].days[t.d].meals[t.s] = m; }
function slotLabel(k){ return SLOTS.find(s => s.k === k).label; }

/* ---------- ÉDITEUR (repas / recette / brouillon) ---------- */
function edObj(){
  if (!MODAL) return null;
  if (MODAL.kind === "meal") return getMeal(MODAL.t);
  if (MODAL.kind === "recipe") return recipeById(MODAL.id);
  if (MODAL.kind === "draft" || MODAL.kind === "temp") return MODAL.obj;
  return null;
}
function nameKey(){ return MODAL.kind === "meal" || MODAL.kind === "temp" ? "name" : "n"; }
const DIFF = ["Facile","Intermédiaire","Élaboré"];
/* met en valeur les repères, points de contrôle et erreurs à éviter */
const fmtStep = t => esc(t).replace(/(Repères|Point de contrôle|À éviter) :/g, '<span class="lab">$1&nbsp;:</span>');
function stepsHTML(steps, ings){
  if (!steps || !steps.length) return `<li class="muted">Aucune étape pour l'instant.</li>`;
  return steps.map(raw => { const p = parseStep(ings ? renderQ(raw, ings) : raw);
    return p.h ? `<li><span class="step-h">${esc(p.h)}</span><p>${fmtStep(p.body)}</p></li>` : `<li><p>${fmtStep(p.body)}</p></li>`; }).join("");
}
function metaLine(o){ return [o.t ? o.t + " min" : "", o.d ? DIFF[+o.d - 1] : ""].filter(Boolean).join(" · "); }

function openEditorEdit(kind, ref){
  MODAL = kind === "meal" ? { kind, t: ref } : kind === "recipe" ? { kind, id: ref } : { kind, obj: ref };
  const o = edObj(); if (!o) return; MODAL.mode = "edit";
  const isRecipe = kind === "recipe" || kind === "draft";
  const title = isRecipe ? o.n : o.name;
  const where = kind === "meal" ? `${esc(S.weeks[ref.w].name)}, ${esc(S.weeks[ref.w].days[ref.d].name)}, ${slotLabel(ref.s).toLowerCase()}`
    : kind === "draft" ? "Nouvelle recette" : kind === "temp" ? (o.gen ? "Idée proposée, à modifier librement avant de l'ajouter" : "Recette du carnet") : "Carnet de recettes";
  const withCur = (list, v) => v && !list.includes(v) ? [...list, v] : list;
  const sel = (key, list, val) => `<label class="field"><span>${{cat:"Catégorie",st:"Style",base:"Féculent"}[key]}</span>
    <select data-ed="${key}">${withCur(list, val).map(x => `<option ${x === val ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>`;
  const recipeFields = isRecipe ? `<div class="fields">
      ${sel("cat", CATS, o.cat)}${sel("st", STYLES, o.st)}${sel("base", [...BASES, "Aucun"], o.base)}
      <label class="field"><span>Temps (min)</span><input data-ed="t" inputmode="numeric" value="${esc(o.t || "")}"></label>
      <label class="field"><span>Difficulté</span><select data-ed="d">${[1,2,3].map(n => `<option value="${n}" ${+o.d === n ? "selected" : ""}>${DIFF[n-1]}</option>`).join("")}</select></label>
    </div>` : "";
  const variation = (kind === "meal" || kind === "temp") && o.gen ? genPanel(o.gen) : "";
  const footer = kind === "meal" ? `
      <button class="btn" data-act="proposeMeal" data-w="${ref.w}" data-d="${ref.d}" data-s="${ref.s}">Autres idées pour ce repas</button>
      <button class="btn" data-act="pickRecipe" data-w="${ref.w}" data-d="${ref.d}" data-s="${ref.s}">Choisir dans le carnet</button>
      <button class="btn" data-act="mealToBook">Enregistrer dans le carnet</button>
      ${o.recipeId && recipeById(o.recipeId) ? `<button class="btn ghost" data-act="resetMeal">Rétablir la recette d'origine</button>` : ""}
      <button class="btn ghost danger" data-act="clearMeal">Retirer ce repas</button>
      <button class="btn primary push" data-act="close">Terminé</button>`
    : kind === "recipe" ? `
      <button class="btn" data-act="recipeToPlan" data-id="${o.id}">Ajouter au planning</button>
      <button class="btn ghost danger" data-act="delRecipe" data-id="${o.id}">Supprimer la recette</button>
      <button class="btn primary push" data-act="close">Terminé</button>`
    : kind === "temp" ? `
      <button class="btn primary" data-act="tempPlace">Ajouter au planning</button>
      <button class="btn" data-act="tempSave">Enregistrer dans le carnet</button>
      <button class="btn ghost push" data-act="close">Fermer</button>`
    : `<button class="btn ghost" data-act="close">Annuler</button><button class="btn primary push" data-act="saveDraft">Enregistrer la recette</button>`;
  openModal(`<div id="edWrap" ${catSt(o.cat)}>
    <p class="eyebrow">${where}</p>
    ${kind !== "draft" ? `<p class="ed-modes"><button class="link" data-act="toCook">← Voir en mode cuisine</button>${kind === "recipe" && o.own ? ` <button class="link" data-act="toCreator">Ouvrir dans le panneau de création</button>` : ""}</p>` : ""}
    <textarea class="ed-title" data-ed="name" rows="1" placeholder="${isRecipe ? "Nom de la recette" : "Nom du repas"}" aria-label="Nom">${esc(title)}</textarea>
    ${o.sub ? `<p class="ed-sub">${esc(o.sub)}</p>` : ""}
    <p class="ed-kcal">${catTag(o.cat)} ${metaLine(o) ? `<span>${esc(metaLine(o))}</span><span class="sep"></span>` : ""}Environ <strong id="edKcal">${fmtK(kcalOf(o))}</strong> kcal <span class="muted">(indicatif, recalculé à chaque modification)</span></p>
    ${recipeFields}${variation}
    <section class="ed-sec"><h3>Ingrédients</h3><ol class="ing-list" id="ingList">${ingRows(o)}</ol>
      <button class="btn" data-act="ingAdd">＋ Ajouter un ingrédient</button></section>
    <section class="ed-sec"><div class="sec-head"><h3>Préparation</h3><button class="link" data-act="editSteps" id="stepsBtn">${o.steps && o.steps.length ? "Modifier la préparation" : "Voir la recette"}</button></div>
      <ol class="steps" id="stepsRead" ${o.steps && o.steps.length ? "" : "hidden"}>${stepsHTML(o.steps, o.ing)}</ol>
      <div id="stepsEditWrap" ${o.steps && o.steps.length ? "hidden" : ""}><p class="muted small">Une étape par ligne. Pour lui donner un titre : « Titre — texte ».</p>
      <textarea data-ed="steps" id="stepsEdit" rows="${Math.max(8, (o.steps || []).length * 2 + 2)}">${esc((o.steps || []).join("\n"))}</textarea></div></section>
    <section class="ed-sec"><h3>Astuce du chef</h3><textarea data-ed="tip" rows="2">${esc(o.tip || "")}</textarea></section>
    <div class="sheet-foot">${footer}</div>
    <datalist id="units">${UNITS.map(u => `<option value="${u}">`).join("")}</datalist></div>`, { focus: kind === "meal" && !o.name ? ".ed-title" : kind === "draft" ? ".ed-title" : null });
}
function fitTitle(){ const t = document.querySelector(".ed-title"); if (t && t.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; } }
function ingRows(o){
  if (!o.ing.length) return `<li class="ing-empty muted">Aucun ingrédient pour l'instant.</li>`;
  return o.ing.map((i, k) => `<li class="ing" data-i="${k}">
    <input class="ing-q" data-ing="q" value="${esc(i.q)}" inputmode="decimal" placeholder="Qté" aria-label="Quantité">
    <input class="ing-u" data-ing="u" value="${esc(i.u)}" list="units" placeholder="unité" aria-label="Unité">
    <input class="ing-n" data-ing="n" value="${esc(i.n)}" placeholder="Ingrédient" aria-label="Ingrédient">
    <span class="ing-tools">
      <button class="icon" data-act="ingUp" data-i="${k}" aria-label="Monter" ${k === 0 ? "disabled" : ""}>↑</button>
      <button class="icon" data-act="ingDown" data-i="${k}" aria-label="Descendre" ${k === o.ing.length - 1 ? "disabled" : ""}>↓</button>
      <button class="icon del" data-act="ingDel" data-i="${k}" aria-label="Supprimer">×</button>
    </span></li>`).join("");
}
function refreshIng(focusLast){
  const o = edObj(); $("#ingList").innerHTML = ingRows(o); $("#edKcal").textContent = fmtK(kcalOf(o));
  if (focusLast) { const r = [...document.querySelectorAll("#ingList .ing-n")].pop(); if (r) r.focus(); }
}
function genPanel(g){
  const f = FORMATS.find(x => x.id === g.f);
  const opt = (arr, cur, lab) => arr.map(k => `<option value="${k}" ${k === cur ? "selected" : ""}>${esc(lab(k))}</option>`).join("");
  return `<section class="gen-panel"><h3>Varier ce plat</h3><p class="muted small">Change un élément, le reste de la recette suit.</p>
    <div class="fields">
      <label class="field"><span>Format</span><select data-gen="f">${opt(FORMATS.map(x => x.id), g.f, k => FORMATS.find(x => x.id === k).n)}</select></label>
      <label class="field"><span>Protéine</span><select data-gen="p">${opt(formatProteins(f), g.p, k => cap(PROTEINS[k].n))}</select></label>
      <label class="field"><span>Féculent</span><select data-gen="s">${opt(f.s, g.s, k => cap(STARCHES[k].n))}</select></label>
      <label class="field"><span>Sauce</span><select data-gen="sa">${opt(f.sa, g.sa, k => cap(SAUCES[k].n))}</select></label>
    </div>
    <button class="link" data-act="genVeg">Changer les légumes</button></section>`;
}

/* saisie en direct dans l'éditeur et ailleurs */
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind === "weekName") { const w = curWeek(); w.name = el.value; saveSoon(); const t = document.querySelector(`.wtab[data-i="${S.ui.week}"]`); if (t) t.textContent = el.value; return; }
  if (el.dataset.bind === "dayName") { curWeek().days[+el.dataset.d].name = el.value; saveSoon(); return; }
  if (el.dataset.bind === "bookSearch") { BOOK.q = el.value; renderBookList(); return; }
  if (el.dataset.bind === "pickSearch") { PICK.q = el.value; renderPickList(); return; }
  if (!MODAL) return;
  const o = edObj(); if (!o) return;
  if (el.dataset.ing) {
    const k = +el.closest(".ing").dataset.i; o.ing[k][el.dataset.ing] = el.value;
    $("#edKcal").textContent = fmtK(kcalOf(o)); saveSoon(); return;
  }
  const key = el.dataset.ed; if (!key) return;
  if (key === "name") { if (/\n/.test(el.value)) el.value = el.value.replace(/\n/g, " "); o[nameKey()] = el.value; fitTitle(); }
  else if (key === "steps") o.steps = el.value.split("\n").map(s => s.trim()).filter(Boolean);
  else if (key === "t" || key === "d") o[key] = el.value;
  else o[key] = el.value;
  if (MODAL.kind !== "draft") saveSoon();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (MODAL && el.dataset.ed && el.tagName === "SELECT") { const o = edObj(); o[el.dataset.ed] = el.dataset.ed === "d" ? +el.value : el.value; if (MODAL.kind !== "draft") saveSoon();
    if (el.dataset.ed === "cat") { const w = $("#edWrap"); if (w) w.style.setProperty("--cc", catVar(el.value)); } }
  if (MODAL && el.dataset.gen && MODAL.kind === "temp") { TEMP = mealFromGen(swapGen(TEMP, el.dataset.gen, el.value)); openEditorEdit("temp", TEMP); return; }
  if (MODAL && el.dataset.gen) { const m = getMeal(MODAL.t); snapshot(); const nm = mealFromGen(swapGen(m, el.dataset.gen, el.value)); nm.id = m.id; setMeal(MODAL.t, nm); save(); openEditorEdit("meal", MODAL.t); toast("Plat modifié", true); }
  if (el.dataset.bind === "shopWeek") { SHOP.w = +el.value; SHOP.days = null; render(); }
  if (el.dataset.bind === "shopDay") { const ds = shopDays(); SHOP.days = ds.map((v, i) => i === +el.dataset.i ? el.checked : v); render(); }
  if (el.dataset.bind === "shopItem") { const w = S.weeks[SHOP.w]; S.checked[w.id] = S.checked[w.id] || {}; S.checked[w.id][el.dataset.key] = el.checked; save(); el.closest("li").classList.toggle("done", el.checked); }
  if (el.dataset.bind === "goal") { S.goal = parseFloat(el.value.replace(",", ".")) || S.goal; save(); render(); }
  if (el.dataset.bind === "importFile") importFile(el.files[0]);
  if (el.dataset.bind === "bookCat") { BOOK.cat = el.value; renderBookList(); }
  if (el.dataset.bind === "bookSt") { BOOK.st = el.value; renderBookList(); }
  if (el.dataset.bind === "bookBase") { BOOK.base = el.value; renderBookList(); }
});

/* ============ ACTIONS (clics) ============ */
const A = {};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { S.ui.view = nav.dataset.nav; save(); render(); window.scrollTo(0, 0); return; }
  if (e.target.id === "modal") { closeModal(); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  const fn = A[a.dataset.act]; if (fn) { e.preventDefault(); fn(a.dataset, a); }
});
const T = ds => ({ w: ds.w != null ? +ds.w : S.ui.week, d: +ds.d, s: ds.s });

A.undo = () => undo();
A.close = () => closeModal();
A.week = ds => { S.ui.week = +ds.i; save(); render(); };
A.goShop = () => { SHOP.w = S.ui.week; SHOP.days = null; S.ui.view = "shop"; render(); window.scrollTo(0, 0); };

/* repas */
A.openMeal = ds => openEditor("meal", T(ds));
A.createMeal = ds => {
  const t = T(ds), sl = SLOTS.find(s => s.k === t.s);
  MODAL = { kind: "create", t };
  openModal(`<p class="eyebrow">${esc(S.weeks[t.w].name)}, ${esc(S.weeks[t.w].days[t.d].name)}</p>
    <h2 class="display-s">${sl.create}</h2>
    <div class="choice-list">
      <button class="choice" data-act="pickRecipe" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Choisir dans le carnet</strong><span>Une des ${S.recipes.length} recettes déjà écrites.</span></button>
      <button class="choice" data-act="proposeMeal" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Me proposer des idées</strong><span>Six suggestions, renouvelables à volonté.</span></button>
      <button class="choice" data-act="freeMeal" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Créer un repas libre</strong><span>Nom, ingrédients, quantités et préparation à saisir.</span></button>
    </div>`);
};
A.freeMeal = ds => {
  const t = T(ds); snapshot();
  setMeal(t, { id: uid(), name: "", recipeId: null, cat: "", st: "", base: "", ing: [{ id: uid(), n: "", q: "", u: "g" }], steps: [], tip: "" });
  save(); openEditor("meal", t);
};
A.clearMeal = () => { const t = MODAL.t; snapshot(); setMeal(t, null); save(); closeModal(); toast("Repas retiré", true); };
A.resetMeal = () => { const t = MODAL.t, m = getMeal(t), r = recipeById(m.recipeId); snapshot(); const nm = mealFromRecipe(r); nm.id = m.id; setMeal(t, nm); save(); openEditor("meal", t); toast("Recette d'origine rétablie", true); };
A.mealToBook = () => {
  const m = getMeal(MODAL.t);
  const r = { id: "r-" + uid(), n: m.name || "Recette sans nom", cat: CATS.includes(m.cat) ? m.cat : (m.cat || "Végétarien"), st: m.st || "Français léger",
    base: m.base || "Aucun", t: m.t || "", d: m.d || 1, ing: m.ing.map(i => ({ id: uid(), n: i.n, q: i.q, u: i.u })), steps: [...m.steps], tip: m.tip || "", own: true };
  S.recipes.unshift(r); m.recipeId = r.id; save(); toast("Ajouté au carnet : " + r.n);
};
A.genVeg = () => { if (MODAL.kind === "temp") { TEMP = mealFromGen(swapGen(TEMP, "v")); openEditorEdit("temp", TEMP); return; } const t = MODAL.t, m = getMeal(t); snapshot(); const nm = mealFromGen(swapGen(m, "v")); nm.id = m.id; setMeal(t, nm); save(); openEditorEdit("meal", t); };

/* ingrédients */
A.ingAdd = () => { const o = edObj(); o.ing.push({ id: uid(), n: "", q: "", u: "g" }); if (MODAL.kind !== "draft") save(); refreshIng(true); };
A.ingDel = ds => { const o = edObj(); o.ing.splice(+ds.i, 1); if (MODAL.kind !== "draft") save(); refreshIng(); };
A.ingUp = ds => { const o = edObj(), i = +ds.i; if (i > 0) { [o.ing[i-1], o.ing[i]] = [o.ing[i], o.ing[i-1]]; if (MODAL.kind !== "draft") save(); refreshIng(); } };
A.ingDown = ds => { const o = edObj(), i = +ds.i; if (i < o.ing.length - 1) { [o.ing[i+1], o.ing[i]] = [o.ing[i], o.ing[i+1]]; if (MODAL.kind !== "draft") save(); refreshIng(); } };

/* jours et semaines */
A.newDay = () => { const w = curWeek(); snapshot(); w.days.push(emptyDay(DAY_NAMES[w.days.length % 7])); save(); render(); toast("Jour ajouté", true);
  const days = document.querySelectorAll(".day"); days[days.length - 1].scrollIntoView({ behavior: "smooth", block: "center" }); };
A.delDay = ds => { const w = curWeek(); snapshot(); w.days.splice(+ds.d, 1); save(); render(); toast("Jour supprimé", true); };
A.delWeek = () => { const w = curWeek(); ask(`Supprimer « ${w.name} » et ses ${w.days.length} jours ?`, "Supprimer", () => { snapshot(); S.weeks.splice(S.ui.week, 1); S.ui.week = Math.max(0, S.ui.week - 1); save(); render(); toast("Semaine supprimée", true); }); };
A.newWeek = () => {
  MODAL = { kind: "newWeek" };
  openModal(`<h2 class="display-s">Créer une nouvelle semaine</h2><p class="muted">7 jours, chacun avec un déjeuner et un dîner.</p>
    <div class="choice-list">
      <button class="choice" data-act="mkWeek" data-mode="auto"><strong>Semaine proposée</strong><span>Menus variés composés automatiquement, modifiables ensuite.</span></button>
      <button class="choice" data-act="mkWeek" data-mode="blank"><strong>Semaine vierge</strong><span>7 jours vides, à remplir depuis le carnet ou les idées.</span></button>
    </div>`);
};
A.mkWeek = ds => {
  snapshot(); const n = "Semaine " + (S.weeks.length + 1); let w;
  if (ds.mode === "auto") { w = { id: uid(), name: n, days: proposeWeek({}).map((p, i) => ({ id: uid(), name: DAY_NAMES[i], meals: p })) }; }
  else { w = { id: uid(), name: n, days: DAY_NAMES.map(dn => emptyDay(dn)) }; }
  S.weeks.push(w); S.ui.week = S.weeks.length - 1; S.ui.view = "plan"; save(); closeModal(); toast(n + " créée", true);
};
A.proposeDay = ds => { const w = curWeek(), d = w.days[+ds.d]; snapshot(); const p = proposeDay({}, weekUsed(w, +ds.d)); d.meals.l = p.l; d.meals.d = p.d; save(); render(); toast(`${d.name} : nouveaux déjeuner et dîner`, true); };
A.proposeWeek = () => { const w = curWeek(); snapshot(); const ps = proposeWeek({});
  w.days.forEach((d, i) => { const p = ps[i % 7]; d.meals.l = p.l; d.meals.d = p.d; });
  save(); render(); toast("Nouveaux menus pour " + w.name, true); };

/* carnet → planning */
let PICK = { t: null, q: "", cat: "" };
A.pickRecipe = ds => {

/* ---------- moteur de propositions (déjeuner et dîner) ---------- */
function catalogFor(f){
  return S.recipes.filter(r => CATS.includes(r.cat) &&
    (!f.cats || !f.cats.length || f.cats.includes(r.cat)) && (!f.bases || !f.bases.length || f.bases.includes(r.base)) && (!f.styles || !f.styles.length || f.styles.includes(r.st)));
}
function oneProposal(f, avoid){
  avoid = avoid || new Set();
  const src = f.src || "mix";
  for (let t = 0; t < 40; t++){
    const useBook = src === "book" || (src === "mix" && Math.random() < 0.4);
    let m = null;
    if (useBook) { const list = catalogFor(f).filter(r => !avoid.has(r.n)); if (list.length) m = mealFromRecipe(pick(list)); else if (src === "book") return null; }
    if (!m) { const g = randomGen({ cats: f.cats, bases: f.bases, styles: f.styles }); if (g) m = mealFromGen(g); }
    if (m && !avoid.has(m.name)) { if (S.autoVeg !== false) autoSide(m); return m; }
  }
  return null;
}
function proposeMeals(n, f){
  const out = [], seen = new Set();
  for (let i = 0; i < n * 3 && out.length < n; i++){ const m = oneProposal(f, seen); if (m && !seen.has(m.name)) { seen.add(m.name); out.push(m); } }
  return out;
}
function weekUsed(w, skip){ const s = new Set(); w.days.forEach((d, i) => { if (i !== skip) ["l","d"].forEach(k => d.meals[k] && s.add(d.meals[k].name)); }); return s; }
function proposeDayOnce(f, avoid){
  avoid = new Set(avoid || []);
  const l = oneProposal(f, avoid) || oneProposal({ src: "gen" }, avoid); avoid.add(l.name);
  let d = null;
  for (let t = 0; t < 25; t++){ d = oneProposal(f, avoid); if (d && (d.cat !== l.cat || (f.cats && f.cats.length === 1))) break; }
  if (!d) d = oneProposal({ src: "gen" }, avoid);
  return { l, d };
}
function proposeWeek(f){
  const days = [], avoid = new Set(), count = {};
  const limit = f.cats && f.cats.length ? 99 : 3;
  for (let i = 0; i < 7; i++){
    let best = null;
    for (let t = 0; t < 30; t++){
      const p = proposeDay(f, avoid);
      const ok = [p.l, p.d].every(m => (count[m.cat] || 0) < limit);
      best = p; if (ok) break;
    }
    [best.l, best.d].forEach(m => { avoid.add(m.name); count[m.cat] = (count[m.cat] || 0) + 1; });
    days.push(best);
  }
  return days;
}

/* ---------- COURSES (déjeuner et dîner) ---------- */
let SHOP = { w: null, days: null, b: true };
function shopDays(){ const w = S.weeks[SHOP.w]; if (!SHOP.days || SHOP.days.length !== w.days.length) SHOP.days = w.days.map(() => true); return SHOP.days; }
function buildShop(){
  const w = S.weeks[SHOP.w], sel = shopDays(), map = new Map();
  w.days.forEach((d, i) => { if (!sel[i]) return; SLOTS_ALL.forEach(sl => { const m = d.meals[sl.k]; if (!m) return;
    m.ing.forEach(it => { if (!String(it.n).trim()) return; const e = lookup(it.n);
      const mergeByKey = e && ["Légumes","Viande & charcuterie","Poisson & crustacés","Œufs","Féculents","Fromages"].includes(e.a);
      const key = mergeByKey ? "k:" + e.k : "n:" + norm(it.n);
      if (!map.has(key)) map.set(key, { key, name: it.n, aisle: e ? e.a : "Divers", parts: {}, names: {} });
      const g = map.get(key); g.names[it.n] = (g.names[it.n] || 0) + 1;

function chartSvg(ws){

  const W = 640, Hh = 220, p = 36, vals = ws.map(x => x.kg).concat([S.goal]);

  const t0 = new Date(ws[0].date).getTime(), t1 = new Date(ws[ws.length - 1].date).getTime() || t0 + 1;
  const X = d => p + (W - 2 * p) * ((new Date(d).getTime() - t0) / Math.max(1, t1 - t0));
  const Y = v => Hh - p + -(Hh - 2 * p) * (v - min) / Math.max(0.1, max - min);
  const pts = ws.map(x => `${X(x.date).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(" ");

    <line x1="${p}" x2="${W - p}" y1="${Y(S.goal)}" y2="${Y(S.goal)}" class="goal-line"/><text x="${W - p}" y="${Y(S.goal) - 6}" class="axis" text-anchor="end">objectif ${fmtN(S.goal)} kg</text>
    <polyline points="${pts}" class="curve"/>${ws.map(x => `<circle cx="${X(x.date)}" cy="${Y(x.kg)}" r="3.5" class="dot"/>`).join("")}</svg>`;
}

const curMonth = () => window.__MONTH || (new Date().getMonth() + 1);

function seasonLabel(o){
  const it = seasonItems(o); if (!it.length) return "Toute l'année";
  const ok = []; for (let m = 1; m <= 12; m++) if (it.every(x => x.s.indexOf(m) >= 0)) ok.push(m);
  if (!ok.length) return "Selon les produits"; if (ok.length >= 11) return "Toute l'année";
  const seasons = [["printemps",[3,4,5]],["été",[6,7,8]],["automne",[9,10,11]],["hiver",[12,1,2]]];
  const on = seasons.map(([, ms]) => ms.filter(m => ok.indexOf(m) >= 0).length >= 2);
  if (!on.some(Boolean)) return ok.map(m => MONTH_NAMES[m - 1]).join(", ");
  if (on.every(Boolean)) return "Toute l'année";
  let st = 0; for (let i = 0; i < 4; i++) if (on[i] && !on[(i + 3) % 4]) { st = i; break; }
  const runs = []; let cur = [];
  for (let i = 0; i < 4; i++) { const k = (st + i) % 4; if (on[k]) cur.push(seasons[k][0]); else if (cur.length) { runs.push(cur); cur = []; } }
  if (cur.length) runs.push(cur);
  return runs.map(r => r.length >= 3 ? r[0] + " à " + r[r.length - 1] : r.join(" – ")).join(" et ");

const VEG_BY_KEY = (() => { const m = {}; Object.keys(VEGS).forEach(k => { const b = VEGS[k].ing[0][0], e = lookup(b); m[e ? e.k : norm(b)] = k; }); return m; })();

const hashStr = s => { let h = 7; String(s).split("").forEach(c => { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return h; };
const hasQ = i => i.q !== "" && i.q != null && parseFloat(String(i.q).replace(",", ".")) > 0;

/* intègre un légume : ingrédient + étape de découpe + étape de cuisson, au bon endroit de la recette */
function addSide(o, key, grams){
  const v = VEGS[key]; if (!v) return false; const b = v.ing[0];
  o.ing = o.ing || []; if (o.ing.some(i => norm(i.n) === norm(b[0]))) return false;
  o.ing.push({ id: uid(), n: b[0], q: grams > 0 ? grams : b[1], u: b[2] });
  const steps = o.steps = o.steps || [], P = steps.map(parseStep);
  const cut = "Découpe, " + low(v.h) + " — " + cap(v.cut) + ".";
  const cook = v.h + " — " + cookStep(v) + (v.t ? " [cuisson " + v.t + " min]" : "");
  let iCook = P.findIndex(p => p.kind === "cook"); if (iCook < 0) iCook = P.findIndex(p => p.kind === "finish" || p.kind === "org"); if (iCook < 0) iCook = steps.length;
  iCook = Math.max(iCook, P.length && P[0].kind === "intro" ? 1 : 0);

function autoSide(m, minG){ if (vegGrams(m) >= (minG || 150)) return false; const k = pickSeasonal(m); return k ? addSide(m, k) : false; }

/* deux noms correspondent s'ils désignent le même produit ; un texte libre (« riz ») peut être contenu dans un nom connu (« riz cuit ») */
function keyMatch(a, b){
  if (!a || !b) return false; if (a === b || canonKey(a) === canonKey(b)) return true;
  if (DB_KEYS.has(a) && DB_KEYS.has(b)) return false;
  return (a.length >= 3 && hasWord(b, a)) || (b.length >= 3 && hasWord(a, b));
}
function essentialIng(i){
  const e = lookup(i.n), uk = unitKind(i.u);
  if (e) { if (e.k === "eau" || e.a === "Herbes & aromates") return false; if (e.a === "Épicerie" && (uk === "c" || uk === "s" || uk === "z")) return false; }
  else if (i.q === "" || i.q == null) return false;
  return !/\b(sel|poivre)\b/.test(norm(i.n));
}
function fridgeResults(){
  const keys = S.pantry.map(p => ingKey(p.n)); if (!keys.length) return [];
  return S.recipes.map(r => {
    const ess = r.ing.filter(essentialIng); if (!ess.length) return null;
    const have = [], miss = []; ess.forEach(i => (keys.some(k => keyMatch(k, ingKey(i.n))) ? have : miss).push(i));
    const st = seasonState(r);
    return { r, score: Math.round(have.length / ess.length * 100), have, miss, sea: !!(st && st.all) };
  }).filter(x => x && x.have.length).sort((a, b) => b.score - a.score || a.miss.length - b.miss.length || (b.sea - a.sea));
}

/* ---------- planning de départ : alternance des catégories, petit-déjeuner chaque jour ---------- */
function buildDefaultPlan(recipes){
  const main = recipes.filter(r => CATS.includes(r.cat));
  const cats = [...new Set(main.map(r => r.cat))], items = [];
  cats.forEach(c => { const l = main.filter(r => r.cat === c); l.forEach((r, i) => items.push({ r, k: (i + .5) / l.length })); });
  items.sort((a, b) => a.k - b.k);
  const seq = []; let rest = items.slice();
  while (rest.length) { let i = rest.findIndex(x => !seq.length || x.r.cat !== seq[seq.length - 1].cat); if (i < 0) i = 0; seq.push(rest.splice(i, 1)[0].r); }
  const weeks = []; let k = 0;
  for (let w = 0; w < 4; w++) {
    const days = [];
    for (let d = 0; d < 7; d++) {
      const day = emptyDay(DAY_NAMES[d]);
      day.meals.l = mealFromRecipe(seq[k++ % seq.length]); day.meals.d = mealFromRecipe(seq[k++ % seq.length]);
      days.push(day);
    }
    weeks.push({ id: uid(), name: "Semaine " + (w + 1), days });
  }
  return weeks;
}

  return norm(i.u) === "piece" && q > 0 ? `<b>${esc(String(i.q).replace(".", ","))}</b> ${esc(plNom(i.n, q))}` : `<b>${esc(qtyStr(i))}</b> ${esc(i.n)}`;
}
/* =====================================================================

const REW = { key: null, base: null, cur: null, prop: null, ctl: null, cook: false };

/* contraintes d'Olivier : ce qui ne doit jamais apparaître dans une recette */
const REW_BAN = [
  ["agrumes et citron", /\b(citron|citrons|agrume|agrumes|orange|oranges|pamplemousse|pamplemousses|mandarine|mandarines|clementine|clementines|lime|limes|yuzu)\b/],
  ["vinaigre", /\bvinaigres?\b/], ["tomate", /\btomates?\b/], ["piment", /\bpiments?\b/], ["gochujang", /\bgochujang\b/],
  ["cornichons et câpres", /\b(cornichons?|capres?)\b/], ["fromage de chèvre", /\bchevre\b/],
  ["chou", /\bchoux?\b(?![- ]?(fleur|rave))/], ["poireau", /\bpoireaux?\b/], ["betterave", /\bbetteraves?\b/], ["navet", /\bnavets?\b/], ["panais", /\bpanais\b/],
  ["légumineuses", /\b(lentilles?|pois chiches?|pois casses?|flageolets?|feves?|graines? de soja|edamames?|houmous|hummus|falafels?|haricots (rouges?|blancs?|secs?|noirs?|azuki))\b/],
  ["soba", /\bsoba\b/], ["cacahuètes", /\bcacahuetes?\b|\barachides?\b/]
];
function rewBanned(texts){
  const t = " " + norm(texts.join(" \n ")) + " ", out = [];
  REW_BAN.forEach(([label, re]) => { if (re.test(t) && out.indexOf(label) < 0) out.push(label); });
  return out;
}

/* ---------- état courant de la recette ouverte (cuisine, éditeur ou création) ---------- */
const rewRaw = s => { const txt = s.txt.trim() || s.h.trim(), h = s.txt.trim() ? s.h.trim() : "";
  return (h ? h + " — " : "") + txt + (s.mins ? " [" + (s.cook ? "cuisson " : "") + s.mins + " min]" : ""); };
function rewCtx(){
  if (!MODAL) return null;
  if (MODAL.kind === "creator" && typeof CR !== "undefined" && CR) {
    return { kind: "creator", name: CR.f.n || "", cat: CR.f.cat, tip: CR.f.tip || "",
      ing: ingSig({ ing: CR.ing }), steps: CR.steps.filter(s => s.txt.trim() || s.h.trim()).map(rewRaw) };
  }
  if (["meal", "recipe", "temp"].indexOf(MODAL.kind) < 0) return null;
  const o = edObj(); if (!o) return null;
  return { kind: MODAL.kind, name: o[nameKey()] || "", cat: o.cat, tip: o.tip || "", ing: ingSig(o), steps: (o.steps || []).slice() };
}
function rewKey(){
  if (!MODAL) return null;
  if (MODAL.kind === "creator") return CR ? "cr:" + CR.id : null;
  if (["meal", "recipe", "temp"].indexOf(MODAL.kind) < 0) return null;
  const o = edObj(); return o ? cookKey() : null;
}
const rewSig = list => list.map(i => norm(i.n) + "|" + String(i.q).replace(",", ".") + "|" + norm(i.u)).sort().join(";");
const rewChanged = () => { const c = rewCtx(); return !!(c && REW.base && rewSig(c.ing) !== rewSig(REW.base.ing)); };

/* suit la recette ouverte : la version de départ sert de référence à Claude */
function rewTrack(){
  const k = rewKey();
  if (!k) { REW.key = null; REW.base = null; return; }
  if (k !== REW.key) { REW.key = k; REW.base = rewCtx(); }
  rewSync();
}
/* affiche ou masque la barre « Valider » sous la liste des ingrédients */
function rewSync(){
  const old = document.getElementById("rewBar");
  if (!MODAL || !REW.key || document.querySelector("#edWrap.cook") || !rewChanged()) { if (old) old.remove(); return; }
  const sec = [...document.querySelectorAll("#edWrap section")].find(s => !s.classList.contains("vg-sec") && /Ingrédients/.test((s.querySelector("h3") || {}).textContent || ""));
  if (!sec) { if (old) old.remove(); return; }
  if (old && old.parentNode === sec) return;
  if (old) old.remove();
  const bar = document.createElement("div"); bar.id = "rewBar"; bar.className = "rew-bar";
  bar.innerHTML = `<div><strong>Ingrédients modifiés</strong><span>Claude vérifie que la recette tient debout et la repense si besoin.</span></div><button class="btn primary" data-act="rewGo">${ic("sparkle")} Valider</button>`;
  sec.appendChild(bar);
}
(function(){
  const om = openModal, cm = closeModal;
  openModal = function(html, opts){ om(html, opts); try { rewTrack(); } catch (e) {} };
  closeModal = function(){ rewHide(); cm(); REW.key = null; REW.base = null; };
  ["input", "change", "click"].forEach(ev => document.addEventListener(ev, () => setTimeout(() => { try { rewSync(); } catch (e) {} }, 80)));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.getElementById("rewOv")) { e.stopImmediatePropagation(); A.rewClose(); }
  }, true);
})();

/* fiche cuisine : liste d'ingrédients visée = liste actuelle + changements en attente */
function rewTarget(o){
  const pend = CK.pend || [], out = [];
  (o.ing || []).forEach((i, k) => { const op = pend.find(p => p.t !== "add" && p.i === k); if (!op) out.push({ n: i.n, q: i.q, u: i.u }); else if (op.t === "swap") out.push({ n: op.to.n, q: op.to.q, u: op.to.u }); });
  pend.forEach(p => { if (p.t === "add") out.push({ n: p.to.n, q: p.to.q, u: p.to.u }); });
  return out.filter(i => String(i.n).trim());
}
function rewPendLines(){
  const w = x => x.n + (qtyStr(x) ? " (" + qtyStr(x) + ")" : "");
  return (CK.pend || []).map(p => p.t === "swap" ? "Remplacer " + p.from + " par " + w(p.to) : p.t === "remove" ? "Retirer " + p.from : "Ajouter " + w(p.to));
}

/* ---------- fenêtre de Claude ---------- */

const rewMsg = (title, text, btns) => rewShow(`<p class="rew-eyebrow">Claude</p><h2 class="rew-title">${esc(title)}</h2>${text ? `<p class="rew-text">${esc(text)}</p>` : ""}<div class="rew-foot">${btns}</div>`);

/* ---------- la demande à Claude ---------- */
function rewPrompt(cur, base, note){
  const lst = l => l.map(i => "- " + i.n + " : " + (qtyStr(i) || "à votre goût")).join("\n");
  const dl = cur.changes || diffIng(base.ing, cur.ing).lines;
  return "Tu es chef cuisinier. Tu aides Olivier, qui vient de modifier les ingrédients d'une recette de son application.\n\n" +
    "RECETTE D'ORIGINE (cohérente) : " + (base.name || "sans nom") + (base.cat ? " (" + base.cat + ")" : "") + "\n" +
    "Ingrédients d'origine :\n" + lst(base.ing) + "\n" +
    "Étapes d'origine (une par ligne) :\n" + base.steps.join("\n") + "\n" + (base.tip ? "Astuce d'origine : " + base.tip + "\n" : "") + "\n" +
    "INGRÉDIENTS FINAUX VOULUS PAR OLIVIER :\n" + lst(cur.ing) + "\n" +
    (dl.length ? "CHANGEMENTS DEMANDÉS : " + dl.join(" ; ") : "AUCUN CHANGEMENT D'INGRÉDIENT : vérifie que la recette est cohérente avec la liste et corrige-la.") + "\n" +
    "Dans les étapes d'origine, la mention ⟦sans X⟧ signale un ingrédient X retiré à la main : réécris proprement ces étapes, sans X et sans cette mention.\n\n" +
    "TA MISSION, DANS L'ORDRE\n" +
    "1. Vérifie la logique culinaire (si un ingrédient en remplace un autre, adapte la cuisson, le geste et l'assaisonnement à sa nature) : les ingrédients voulus vont-ils ensemble (saveurs, textures, cuissons, rôle dans l'assiette) ? Exemple d'erreur à éviter : mélanger des haricots dans une purée.\n" +
    "2. Réécris ce qu'il faut pour intégrer chaque changement de façon naturelle : modifie une étape existante, ajoute une étape bien placée (jamais après le dressage ou le service), retire une étape devenue inutile, ajuste quantités et durées. Conserve tous les autres ingrédients et le caractère du plat, sauf si la logique l'impose. Si l'association ne fonctionne pas telle quelle, repense la recette pour qu'elle fonctionne (par exemple des haricots verts poêlés à côté de la purée) en gardant les ingrédients voulus ; si c'est vraiment impossible, retire le moins possible et dis-le dans « verdict ».\n" +
    "3. Respecte les contraintes d'Olivier. Jamais : agrumes et citron, vinaigre, tomate, piment, gochujang, cornichons et câpres, fromage de chèvre, chou, poireau, betterave, navet, panais, légumineuses, bœuf gras, soba, cacahuètes et beurre de cacahuète. Épices douces seulement, cuisine pauvre en graisses. Portions de féculents (poids cuit) : 200 g de riz, 250 g de pomme de terre, 220 g de pâtes. Environ 850 kcal au plus pour le plat.\n\n" +
    "FORMAT DES ÉTAPES : « Titre court — consigne détaillée et concrète. [N min] ». Garde, s'ils existent, « Avant de commencer — … » en premier et « Organisation — … » en dernier, mis à jour. Dans une étape, chaque quantité s'écrit {{nom exact de l'ingrédient}} (exemple : « Ajouter {{haricots verts}} de haricots verts ») : l'application remplace par la quantité de la liste. Les noms entre accolades doivent être identiques à ceux du tableau « ing ».\n\n" +
    (note ? "ATTENTION, ta réponse précédente était refusée : " + note + " Corrige.\n\n" : "") +
    "RÉPONDS UNIQUEMENT PAR UN OBJET JSON, sans texte autour, sans bloc de code :\n" +
    '{"coherent": true ou false (la combinaison voulue fonctionne-t-elle telle quelle ?),\n "verdict": "1 à 3 phrases en français simple : ce qui fonctionne ou pas, et ce que tu as décidé",\n "name": "nom du plat à jour",\n "t": temps total en minutes (nombre),\n "ing": [{"n": "nom", "q": nombre ou "", "u": "g|ml|pièce|tranche|c. à café|c. à soupe|pincée|quelques brins|feuille|pot|tasse"}],\n "steps": ["Titre — consigne [N min]"],\n "tip": "astuce du chef courte, ou chaîne vide",\n "changes": ["3 à 6 phrases courtes : ce qui change dans les étapes"]}';
}
function rewParse(txt){
  const a = String(txt || "").indexOf("{"), b = String(txt || "").lastIndexOf("}"); if (a < 0 || b < a) return null;
  let p; try { p = JSON.parse(txt.slice(a, b + 1)); } catch (e) { return null; }
  if (!p || !Array.isArray(p.ing) || !Array.isArray(p.steps)) return null;
  const ing = p.ing.map(i => ({ n: String((i && i.n) || "").trim(), q: i && i.q != null && i.q !== "" ? String(i.q).replace(",", ".") : "", u: String((i && i.u) || "g").trim() })).filter(i => i.n);
  const steps = p.steps.map(s => String(s || "").trim()).filter(Boolean);
  if (ing.length < 2 || steps.length < 2) return null;
  return { coherent: p.coherent !== false, verdict: String(p.verdict || "").trim(), name: String(p.name || "").trim(), t: +p.t > 0 ? Math.round(+p.t) : 0,
    ing, steps, tip: String(p.tip || "").trim(), changes: (Array.isArray(p.changes) ? p.changes : []).map(x => String(x).trim()).filter(Boolean).slice(0, 8) };
}
/* contrôles faits par l'application, quoi que Claude réponde */
function rewCheck(p, base){
  const hard = [], warn = [], had = base ? rewBanned(base.ing.map(i => i.n).concat(base.steps, [base.name, base.tip])) : [];
  const bad = rewBanned(p.ing.map(i => i.n).concat(p.steps, [p.name, p.tip])).filter(x => had.indexOf(x) < 0); if (bad.length) hard.push("la proposition contient « " + bad.join(", ") + " », exclu des contraintes d'Olivier.");
  if (p.steps.some(s => /⟦/.test(s))) hard.push("des marqueurs ⟦sans …⟧ restent dans les étapes.");
  if (base) { const txt = " " + norm(p.steps.join(" ")) + " ", gone = base.ing.filter(i => !p.ing.some(x => norm(x.n) === norm(i.n))).map(i => ({ n: i.n, k: ingKey(i.n) })).filter(x => x.k && x.k.length >= 4 && STOP_KEYS.indexOf(x.k) < 0 && txt.indexOf(x.k) >= 0);
    if (gone.length) hard.push("les étapes citent encore " + gone.map(x => x.n).join(", ") + ", qui n'est plus dans la liste d'ingrédients."); }
  const miss = []; (p.steps.join(" ").match(/\{\{([^}]+)\}\}/g) || []).forEach(m => { const n = norm(m.slice(2, -2)); if (!p.ing.some(i => norm(i.n) === n || norm(i.n).indexOf(n) >= 0) && miss.indexOf(n) < 0) miss.push(n); });
  if (miss.length) hard.push("les quantités {{" + miss.join("}}, {{") + "}} ne correspondent à aucun ingrédient de la liste.");
  const kc = kcalOf({ ing: p.ing }); if (kc > 850) warn.push("≈ " + fmtK(kc) + " kcal : au-delà de 850. Le bouton « Adapter à ma cible » ajustera les portions.");
  return { hard, warn, kc };
}
async function rewCall(sample, cur, base){
  let note = "";
  for (let n = 0; n < 2; n++) {
    const r = await sample(rewPrompt(cur, base, note), { cache: false, signal: REW.ctl.signal });
    const p = rewParse(r && r.text);
    if (!p) { note = "le JSON était illisible ou incomplet."; continue; }
    const c = rewCheck(p, base); if (!c.hard.length) return { p, c };
    note = c.hard.join(" ");
    if (n === 1) return { p, c };
  }
  return { p: null, c: null, note };
}
A.rewGo = async () => {
  const cook = !!document.querySelector("#edWrap.cook") && MODAL && MODAL.kind !== "creator";
  let cur, base;
  if (cook) { base = rewCtx(); const o = edObj(); cur = base && o ? Object.assign({}, base, { ing: rewTarget(o), changes: rewPendLines() }) : null; }
  else { cur = rewCtx(); base = REW.base; }
  if (!cur || !base) return;
  REW.cur = cur; REW.prop = null; REW.cook = cook;
  const had = base.ing.map(i => norm(i.n)), bad = rewBanned(cur.ing.filter(i => had.indexOf(norm(i.n)) < 0).map(i => i.n));
  if (bad.length) return rewMsg("Ingrédient exclu", "« " + bad.join(", ") + " » fait partie de ce que vous ne mangez pas. Retirez-le de la liste, puis validez de nouveau.", `<button class="btn primary push" data-act="rewClose">Compris</button>`);
  let sample = null; try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) {}
  if (!sample) return rewMsg("Claude n'est pas disponible ici", "Cette fonction marche dans la version publiée sur Claude (page claude.ai), pas dans le fichier ouvert depuis l'ordinateur. " + (cook && (CK.pend || []).length ? "Vos changements restent en attente : la recette n'a pas été modifiée. Vous pouvez aussi les appliquer sans Claude, mais les étapes seront moins précises." : "La recette n'a pas été modifiée."), cook && (CK.pend || []).length ? `<button class="btn" data-act="rewMech">Appliquer sans Claude</button><button class="btn primary push" data-act="rewClose">Fermer</button>` : `<button class="btn primary push" data-act="rewClose">Fermer</button>`);
  REW.ctl = new AbortController();
  rewShow(`<p class="rew-eyebrow">Claude</p><h2 class="rew-title">Je vérifie la recette…</h2><p class="rew-text">Je contrôle que les ingrédients vont ensemble, puis j'adapte les étapes. Cela peut prendre une minute.</p><div class="rew-pulse" aria-hidden="true"><i></i><i></i><i></i></div><div class="rew-foot"><button class="btn ghost push" data-act="rewStop">Arrêter</button></div>`);
  try {
    const res = await rewCall(sample, cur, base);
    if (!res.p) return rewMsg("Je n'ai pas pu proposer une version fiable", "Claude n'a pas renvoyé de recette exploitable (" + (res.note || "réponse incomplète") + "). Votre recette n'a pas été modifiée.", `<button class="btn" data-act="rewGo">Réessayer</button><button class="btn primary push" data-act="rewClose">Fermer</button>`);
    if (res.c.hard.length) return rewMsg("Je n'ai pas pu proposer une version fiable", "Claude a proposé une recette qui ne passe pas les contrôles : " + res.c.hard.join(" ") + " Votre recette n'a pas été modifiée.", `<button class="btn" data-act="rewGo">Réessayer</button><button class="btn primary push" data-act="rewClose">Fermer</button>`);
    REW.prop = res.p; rewProposal(res.p, res.c, cur);

    if (REW.ctl.signal.aborted || (e && (e.code === "aborted" || e.name === "AbortError"))) return;
    const t = e && e.code === "not_granted" ? "Autorisation refusée : vous pouvez réessayer et accepter la demande." : e && e.code === "rate_limited" ? "Trop de demandes d'affilée, patientez quelques secondes." : "Claude n'a pas pu répondre pour l'instant. Réessayez dans un instant.";
    rewMsg("Pas de réponse", t + " Votre recette n'a pas été modifiée.", `<button class="btn" data-act="rewGo">Réessayer</button><button class="btn primary push" data-act="rewClose">Fermer</button>`);
  }
};
A.rewStop = () => { if (REW.ctl) REW.ctl.abort(); rewHide(); };
A.rewClose = () => { if (REW.ctl) REW.ctl.abort(); rewHide(); };

/* ---------- la proposition ---------- */
function rewProposal(p, c, cur){
  const dI = diffIng(cur.ing, p.ing), k0 = kcalOf({ ing: cur.ing });
  const lines = p.changes.concat(dI.lines); if (c.kc !== k0) lines.push("≈ " + fmtK(k0) + " → " + fmtK(c.kc) + " kcal");
  const steps = p.steps.map(s => parseStep(renderQ(s, p.ing)));
  const verdict = `<div class="rew-verdict ${p.coherent ? "ok" : "ko"}"><strong>${p.coherent ? "La combinaison fonctionne" : "Telle quelle, la combinaison ne fonctionne pas"}</strong>${p.verdict ? `<p>${esc(p.verdict)}</p>` : ""}</div>`;
  rewShow(`<p class="rew-eyebrow">Proposition de Claude</p><h2 class="rew-title">${esc(p.name || cur.name || "Recette")}</h2>${verdict}
    ${c.warn.length ? `<p class="rew-warn">${c.warn.map(esc).join("<br>")}</p>` : ""}
    ${lines.length ? `<h3 class="rew-h">Ce qui change</h3><ul class="rew-list">${lines.map(l => `<li>${esc(l.replace(/^[+−-]\s+/, ""))}</li>`).join("")}</ul>` : ""}
    <h3 class="rew-h">Ingrédients</h3><ul class="rew-ings">${p.ing.map(i => `<li><span>${esc(i.n)}</span><b>${esc(qtyStr(i))}</b></li>`).join("")}</ul>
    <h3 class="rew-h">Préparation</h3><ol class="rew-steps">${steps.map(s => `<li>${s.h ? `<strong>${esc(s.h)}</strong>` : ""}<span>${esc(s.body)}</span></li>`).join("")}</ol>
    <div class="rew-foot"><button class="btn ghost" data-act="rewKeep">${REW.cook ? "Pas maintenant" : "Garder ma version"}</button><button class="btn primary push" data-act="rewUse">Utiliser cette recette</button></div>`);
}
A.rewKeep = () => { if (!REW.cook) REW.base = rewCtx(); rewHide(); rewSync(); };
/* sans Claude : mêmes changements, mais appliqués mécaniquement aux étapes */
A.rewMech = () => {
  rewHide(); const o = edObj(); if (!o) return; const pend = (CK.pend || []).slice(); CK.pend = [];
  cookOp(o => {
    const at = n => o.ing.findIndex(x => norm(x.n) === norm(n));
    pend.forEach(p => { if (p.t !== "add") { const i = at(p.from); if (i >= 0) removeIngredient(o, i); } if (p.t !== "remove") addIngredient(o, p.to.n, p.to.q, p.to.u); });
    return { title: "Changements appliqués sans Claude", extra: [] };
  });
};

/* applique la proposition à la recette ouverte */
function rewApply(p){
  const idOf = list => n => { const e = list.find(i => norm(i.n) === norm(n)); return e && e.id ? e.id : uid(); };
  if (MODAL.kind === "creator") {
    const id = idOf(CR.ing);
    CR.ing = p.ing.map(i => ({ id: id(i.n), n: i.n, q: i.q, u: i.u }));
    CR.steps = p.steps.map(parseStep).map(s => ({ h: s.h, txt: s.body, mins: s.expl ? s.mins : 0, cook: s.kind === "cook" }));
    if (p.name) CR.f.n = p.name; if (p.tip) CR.f.tip = p.tip; if (p.t) CR.f.t = p.t;
    renderCreator(); return;
  }
  const o = edObj(), persist = MODAL.kind !== "temp"; if (!o) return; if (persist) snapshot();
  const key = cookKey(), id = idOf(o.ing || []);
  o.ing = p.ing.map(i => ({ id: id(i.n), n: i.n, q: i.q, u: i.u })); o.steps = p.steps.slice();
  if (p.name) o[nameKey()] = p.name; if (p.tip) o.tip = p.tip; if (p.t) o.t = p.t;
  o.iv = (o.iv || []).filter(x => o.ing.some(i => { const vk = vegKeyOfIng(i.n); return vk && VEGS[vk] && VEGS[vk].n === x; }));
  delete o.gen; if (S.cooked) delete S.cooked[key]; CK.pend = []; CK.sw = CK.swap = null;
  if (persist) save();
  if (document.querySelector("#edWrap.cook")) refreshCook({ title: "Recette mise à jour par Claude", lines: ["Les étapes et la liste d'ingrédients correspondent à nouveau."], undo: persist }, []);
  else openEditorEdit(MODAL.kind, modalRef());
}
A.rewUse = () => {
  const p = REW.prop; if (!p || !MODAL) return rewHide();
  const kind = MODAL.kind; rewApply(p); REW.base = rewCtx(); REW.prop = null;
  const offer = kind === "meal" || kind === "temp";
  if (offer) return rewShow(`<p class="rew-eyebrow">Claude</p><h2 class="rew-title">Recette mise à jour</h2><p class="rew-text">Les ingrédients et les étapes sont à jour. Souhaitez-vous aussi l'ajouter à vos recettes ?</p><div class="rew-foot"><button class="btn ghost" data-act="rewClose">Pas maintenant</button><button class="btn primary push" data-act="rewToBook">Ajouter au carnet</button></div>`);

};
A.rewToBook = () => {
  const o = MODAL && (MODAL.kind === "meal" || MODAL.kind === "temp") ? edObj() : null; if (!o) return rewHide();
  const taken = n => S.recipes.some(r => norm(r.n) === norm(n)); let name = (o.name || "Recette sans nom").trim();
  if (taken(name)) { const base = name; let k = 2; name = base + " (variante)"; while (taken(name)) name = base + " (variante " + k++ + ")"; }
  const r = { id: "r-" + uid(), n: name, cat: CATS.includes(o.cat) ? o.cat : (o.cat || "Végétarien"), st: o.st || "Français léger", base: o.base || "Aucun", t: o.t || "", d: o.d || 1,
    ing: o.ing.map(i => ({ id: uid(), n: i.n, q: i.q, u: i.u })), steps: [...o.steps], tip: o.tip || "", own: true };
  S.recipes.unshift(r); if (MODAL.kind === "meal") o.recipeId = r.id; save(); rewHide(); toast("Ajouté au carnet : " + r.n);
};

/* proposition d'une journée : on garde, parmi plusieurs essais, celle qui s'approche le plus de la cible */
function proposeDay(f, avoid){
  let best = null; const tg = dayTarget();
  for (let i = 0; i < 6; i++) { const p = proposeDayOnce(f, avoid); const diff = Math.abs(kcalOf(p.l) + kcalOf(p.d) - tg); if (!best || diff < best.diff) best = { p, diff }; }
  if (S.autoAdapt !== false) adaptDay({ meals: best.p }, tg);
  return best.p;
}
function viewInsp(){
  const mode = (S.ui && S.ui.insp) || "compose";
  const seg = `<div class="seg ins-mode" role="tablist">${[["compose","Composer"],["fridge","Avec mon frigo"]].map(([v, l]) => `<button class="seg-b" data-act="inspMode" data-v="${v}" aria-pressed="${mode === v}">${l}</button>`).join("")}</div>`;
  return seg + (mode === "fridge" ? viewFridge() : viewInspCompose());
}

/* ---------- démarrage ---------- */
load(); render();
try { const op = S.ui && S.ui.open; if (op) { const ok = op.kind === "meal" ? getMeal(op.ref) : recipeById(op.ref); if (ok) openCook(op.kind, op.ref); else delete S.ui.open; } } catch (e) {}
